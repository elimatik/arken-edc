<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arken EDC — Coding</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --color-nav-bg:#1A1F2E;--color-nav-hover:#2C3248;--color-nav-icon:#8aafc8;
  --color-page-bg:#FBFBFB;--color-surface:#FFFFFF;
  --color-border:#E8E8E6;--color-border-subtle:#F0F0EE;
  --color-text-primary:#2C2D33;--color-text-secondary:#4F535B;
  --color-text-tertiary:#6D7480;--color-text-placeholder:#C4C4C2;
  --color-hover-bg:#F0F0EE;--color-cta-bg:#1A1F2E;--color-cta-hover:#2C3248;
  --color-link:#3D4A5C;--color-focus-ring:#3D8FE0;
  --amber-50:#FFF8E7;--amber-200:#F5B830;--amber-700:#8A5C00;
  --red-50:#FFF0F0;--red-200:#EC8585;--red-600:#B52626;
  --green-50:#EEFAF4;--green-200:#58BC88;--green-600:#1A6B47;
  --blue-50:#E8F4FF;--blue-200:#7AB8EE;--blue-600:#1760A8;
  --slate-50:#EEF1F6;--slate-200:#8AA0B8;--slate-600:#3D5A78;
  --purple-50:#F0EEFF;--purple-200:#A9A3EC;--purple-600:#534AB7;
  --orange-50:#FFF0E8;--orange-200:#F48E50;--orange-600:#C94C0C;
  --font-sans:'Roboto',system-ui,sans-serif;--font-mono:'Roboto Mono',monospace;
  --text-xs:11px;--text-sm:12px;--text-base:14px;--text-lg:16px;--text-3xl:24px;
  --weight-regular:400;--weight-medium:500;--weight-bold:700;
  --radius-sm:2px;--radius-md:4px;--radius-lg:6px;--radius-full:9999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --duration-fast:120ms;--ease-default:cubic-bezier(0.16,1,0.3,1);
  --tracking-caps:0.07em;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--text-base);color:var(--color-text-primary);background:var(--color-page-bg);-webkit-font-smoothing:antialiased}

/* ─── Shell ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidenav{width:74px;background:var(--color-nav-bg);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;gap:2px;flex-shrink:0}
.nav-logo{width:30px;height:30px;border-radius:var(--radius-md);background:var(--color-nav-hover);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-3)}
.nav-logo span{font-size:var(--text-base);font-weight:700;color:#fff}
.nav-item{width:100%;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--color-nav-icon);cursor:pointer;transition:background var(--duration-fast);padding:4px 0}
.nav-item:hover{background:var(--color-nav-hover);color:#fff}
.nav-item.active{background:var(--color-nav-hover);color:#fff}
.nav-item i{font-size:20px}.nav-label{font-size:11px;font-weight:500;color:inherit;text-align:center}
.nav-spacer{flex:1}.nav-sep{width:100%;height:1px;background:rgba(255,255,255,0.08);margin:var(--space-2) 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:56px;background:var(--color-nav-bg);display:flex;align-items:center;padding:0 var(--space-5);gap:var(--space-3);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.06)}
.tb-study{background:var(--color-nav-hover);color:#fff;font-size:var(--text-base);font-weight:500;padding:7px var(--space-4);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:none;background:transparent;color:#fff;cursor:pointer}
.tb-icon i{font-size:20px}
.tb-role{background:var(--color-nav-hover);color:#fff;font-size:var(--text-sm);font-weight:500;padding:3px var(--space-2);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:#3D5A78;color:#EEF1F6;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
.page-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ─── Buttons ── */
.btn-primary{display:flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer;white-space:nowrap;transition:background var(--duration-fast)}
.btn-primary:hover{background:var(--color-cta-hover)}
.btn-primary i{font-size:14px}
.btn-secondary{display:flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer;white-space:nowrap;transition:background var(--duration-fast)}
.btn-secondary:hover{background:var(--color-hover-bg)}
.btn-secondary i{font-size:14px}
.btn-icon{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:none;border-radius:var(--radius-md);color:var(--color-text-tertiary);cursor:pointer;transition:background var(--duration-fast)}
.btn-icon:hover{background:var(--color-hover-bg);color:var(--color-text-primary)}
.btn-icon i{font-size:15px}

/* ─── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;border:1px solid;white-space:nowrap}
.badge-pending {background:var(--slate-50);border-color:var(--slate-200);color:var(--slate-600)}
.badge-coded   {background:var(--green-50);border-color:var(--green-200);color:var(--green-600)}
.badge-review  {background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.badge-auto    {background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-600)}
.badge-conflict{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}

/* ═══════════════════════════════════════
   VIEW 1 — WORKLIST
   ═══════════════════════════════════════ */
#view-worklist{display:flex;flex-direction:column;flex:1;overflow:hidden}

.page-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border);background:var(--color-surface);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.page-title{font-size:var(--text-3xl);font-weight:500}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--color-border);background:var(--color-surface);flex-shrink:0;padding:0 var(--space-5)}
.tab{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);font-weight:500;color:var(--color-text-tertiary);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--color-text-primary)}
.tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);font-size:10px;font-weight:700;font-family:var(--font-mono);background:var(--color-page-bg);border:1px solid var(--color-border);color:var(--color-text-secondary)}
.tab.active .tab-count{background:var(--color-cta-bg);border-color:var(--color-cta-bg);color:#fff}

/* Filter bar */
.filter-bar{padding:var(--space-3) var(--space-5);background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:var(--space-3);flex-shrink:0}
.search-box{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);min-width:220px}
.search-box i{font-size:14px;color:var(--color-text-placeholder);flex-shrink:0}
.search-box input{border:none;outline:none;font-size:var(--text-sm);font-family:var(--font-sans);background:transparent;flex:1}
.search-box input::placeholder{color:var(--color-text-placeholder)}
.filter-select{height:32px;padding:0 24px 0 var(--space-2);font-size:var(--text-sm);font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='8' height='12' viewBox='0 0 8 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L1 11' stroke='%236D7480' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;outline:none}
.tb-count{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-left:auto}

/* List table */
.table-wrap{flex:1;overflow-y:auto}
.list-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.list-table thead th{position:sticky;top:0;z-index:5;background:var(--color-surface);padding:var(--space-2) var(--space-3);text-align:left;font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);border-bottom:1px solid var(--color-border);white-space:nowrap;user-select:none}
.list-table thead th:first-child{padding-left:var(--space-5)}
.list-table thead th:last-child{padding-right:var(--space-5);text-align:right}
.list-table thead th:hover .sort-icon{color:var(--color-text-placeholder) !important}
.list-table thead th{cursor:pointer}
.list-table tbody tr{border-bottom:1px solid var(--color-border-subtle);cursor:pointer;transition:background var(--duration-fast)}
.list-table tbody tr:hover{background:var(--color-hover-bg)}
.list-table tbody tr.active-row{background:var(--blue-50)}
.list-table tbody td{padding:var(--space-2) var(--space-3);vertical-align:middle}
.list-table tbody td:first-child{padding-left:var(--space-5)}
.list-table tbody td:last-child{padding-right:var(--space-5);text-align:right}
.cell-mono{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--color-text-secondary)}
.cell-muted{color:var(--color-text-secondary);font-size:var(--text-sm)}
.verbatim-term{font-size:var(--text-sm);color:var(--color-text-primary);font-style:italic}
.coded-term{font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary)}
.coded-path{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:1px;font-family:var(--font-mono)}

/* Summary bar */
.summary-bar{padding:var(--space-2) var(--space-5);background:var(--color-surface);border-top:1px solid var(--color-border);display:flex;align-items:center;gap:var(--space-4);font-size:var(--text-xs);color:var(--color-text-tertiary);flex-shrink:0}
.sv{font-weight:500;color:var(--color-text-primary);font-family:var(--font-mono)}
.sv.ok{color:var(--green-600)}.sv.warn{color:var(--amber-700)}.sv.crit{color:var(--red-600)}

/* ═══════════════════════════════════════
   VIEW 2 — CODING PANEL (slide-in)
   ═══════════════════════════════════════ */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(14,18,28,0.35);z-index:100}
.panel-overlay.open{display:block}
.code-panel{position:fixed;top:0;right:0;width:520px;height:100%;background:var(--color-surface);border-left:1px solid var(--color-border);display:flex;flex-direction:column;z-index:101;transform:translateX(100%);transition:transform 300ms var(--ease-default);box-shadow:-8px 0 32px rgba(14,18,28,0.12)}
.code-panel.open{transform:translateX(0)}

/* Panel header */
.cp-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border);flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3)}
.cp-title{font-size:var(--text-lg);font-weight:500}
.cp-meta{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:3px;display:flex;align-items:center;gap:var(--space-3)}
.cp-close{width:28px;height:28px;border:none;background:none;cursor:pointer;border-radius:var(--radius-sm);color:var(--color-text-tertiary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cp-close:hover{background:var(--color-hover-bg)}
.cp-close i{font-size:16px}

/* Verbatim term block */
.verbatim-block{padding:var(--space-3) var(--space-5);background:var(--color-page-bg);border-bottom:1px solid var(--color-border);flex-shrink:0}
.vb-label{font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);margin-bottom:var(--space-1)}
.vb-term{font-size:var(--text-base);font-style:italic;color:var(--color-text-primary)}
.vb-context{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:3px;display:flex;align-items:center;gap:var(--space-3)}

/* Dictionary selector */
.dict-selector{padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-border);flex-shrink:0;display:flex;align-items:center;gap:var(--space-3)}
.dict-selector label{font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary);flex-shrink:0}
.dict-btn{height:28px;padding:0 var(--space-3);font-size:var(--text-xs);font-weight:500;font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;transition:all var(--duration-fast)}
.dict-btn.active{background:var(--color-cta-bg);border-color:var(--color-cta-bg);color:#fff}

/* Search */
.code-search{padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-border);flex-shrink:0}
.code-search-box{display:flex;align-items:center;gap:var(--space-2);height:36px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}
.code-search-box i{font-size:16px;color:var(--color-text-placeholder);flex-shrink:0}
.code-search-box input{border:none;outline:none;font-size:var(--text-sm);font-family:var(--font-sans);background:transparent;flex:1;color:var(--color-text-primary)}
.code-search-box input::placeholder{color:var(--color-text-placeholder)}

/* Hierarchy breadcrumb */
.hier-crumb{padding:var(--space-2) var(--space-5);background:var(--color-page-bg);border-bottom:1px solid var(--color-border);font-size:var(--text-xs);color:var(--color-text-tertiary);display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap}
.crumb-item{cursor:pointer;color:var(--color-link);text-decoration:underline;text-underline-offset:2px}
.crumb-sep{color:var(--color-text-placeholder)}

/* Results list */
.code-results{flex:1;overflow-y:auto}
.result-section{margin-bottom:0}
.result-section-title{padding:var(--space-2) var(--space-5);font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);background:var(--color-page-bg);border-bottom:1px solid var(--color-border-subtle);position:sticky;top:0;z-index:2}
.code-result-item{display:flex;align-items:flex-start;justify-content:space-between;padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-border-subtle);cursor:pointer;transition:background var(--duration-fast);gap:var(--space-3)}
.code-result-item:hover{background:var(--color-hover-bg)}
.code-result-item.selected{background:var(--blue-50);border-left:3px solid var(--blue-600)}
.cri-left{flex:1;min-width:0}
.cri-term{font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary)}
.cri-code{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:1px}
.cri-path{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:2px;line-height:1.4}
.cri-right{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}
.match-score{font-size:10px;font-family:var(--font-mono);color:var(--color-text-placeholder);background:var(--color-page-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:1px 5px}
.drill-btn{width:24px;height:24px;border:none;background:none;cursor:pointer;border-radius:var(--radius-sm);color:var(--color-text-placeholder);display:flex;align-items:center;justify-content:center}
.drill-btn:hover{background:var(--color-hover-bg);color:var(--color-text-primary)}
.drill-btn i{font-size:13px}

/* Selected code block */
.selected-code-block{padding:var(--space-4) var(--space-5);border-top:2px solid var(--color-border);background:var(--color-surface);flex-shrink:0}
.scb-label{font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);margin-bottom:var(--space-2)}
.scb-term{font-size:var(--text-base);font-weight:500;color:var(--color-text-primary)}
.scb-code{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--color-text-tertiary);margin-top:2px}
.scb-path{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:4px;line-height:1.5}
.scb-actions{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
</style>
</head>
<body>
<div class="shell">
  <nav class="sidenav">
    <div class="nav-logo"><span>Ar</span></div>
    <button class="nav-item"><i class="ti ti-layout-dashboard"></i><span class="nav-label">Dashboard</span></button>
    <button class="nav-item"><i class="ti ti-list"></i><span class="nav-label">Animals</span></button>
    <button class="nav-item"><i class="ti ti-help-circle"></i><span class="nav-label">Queries</span></button>
    <button class="nav-item"><i class="ti ti-chart-bar"></i><span class="nav-label">Reports</span></button>
    <button class="nav-item active"><i class="ti ti-tags"></i><span class="nav-label">Coding</span></button>
    <div class="nav-spacer"></div>
    <div class="nav-sep"></div>
    <button class="nav-item"><i class="ti ti-clipboard-list"></i><span class="nav-label">Audit</span></button>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="tb-study">AK-2401 — BRD Cattle Phase II <i class="ti ti-chevron-right" style="font-size:11px"></i></button>
      <div class="tb-right">
        <button class="tb-icon"><i class="ti ti-bell"></i></button>
        <button class="tb-icon"><i class="ti ti-settings"></i></button>
        <button class="tb-role">DM <i class="ti ti-chevron-right" style="font-size:10px"></i></button>
        <div class="tb-avatar">AR</div>
      </div>
    </header>

    <div class="page-wrap">
      <div id="view-worklist">

        <div class="page-header">
          <div>
            <h1 class="page-title">Coding</h1>
            <div style="font-size:var(--text-sm);color:var(--color-text-tertiary);margin-top:2px">Adverse event and medical history term coding · VeDRA v3.1 · MedDRA v26.1</div>
          </div>
          <div style="display:flex;gap:var(--space-2)">
            <button class="btn-secondary"><i class="ti ti-download"></i> Export</button>
            <button class="btn-secondary" onclick="autoCodeAll()"><i class="ti ti-refresh"></i> Auto-code all</button>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" onclick="filterTab(this,'all')">All terms <span class="tab-count" id="cnt-all">12</span></button>
          <button class="tab" onclick="filterTab(this,'pending')">Pending <span class="tab-count" id="cnt-pending">5</span></button>
          <button class="tab" onclick="filterTab(this,'review')">Needs review <span class="tab-count" id="cnt-review">2</span></button>
          <button class="tab" onclick="filterTab(this,'coded')">Coded <span class="tab-count" id="cnt-coded">5</span></button>
        </div>

        <div class="filter-bar">
          <div class="search-box"><i class="ti ti-search"></i><input type="search" placeholder="Search verbatim term…"></div>
          <select class="filter-select"><option>All dictionaries</option><option>VeDRA</option><option>MedDRA</option></select>
          <select class="filter-select"><option>All forms</option><option>Adverse event</option><option>Medical history</option><option>Concomitant meds</option></select>
          <select class="filter-select"><option>All subjects</option><option>AUSB1P1-01</option><option>DALB1P1-01</option></select>
          <span class="tb-count" id="row-count">12 terms</span>
        </div>

        <div class="table-wrap">
          <table class="list-table" id="coding-table">
            <thead><tr>
              <th onclick="doSort(0)" style="cursor:pointer">Verbatim term <i class="ti ti-arrows-sort sort-icon" style="font-size:11px;color:transparent;margin-left:2px"></i></th>
              <th onclick="doSort(1)" style="cursor:pointer">Subject <i class="ti ti-arrows-sort sort-icon" style="font-size:11px;color:transparent;margin-left:2px"></i></th>
              <th onclick="doSort(2)" style="cursor:pointer">Species / Breed <i class="ti ti-arrows-sort sort-icon" style="font-size:11px;color:transparent;margin-left:2px"></i></th>

function openPanel(id) {

  document.getElementById('cp-title').textContent = term.status === 'pending' ? 'Code term' : 'Edit coding';
  document.getElementById('cp-subject').textContent = term.subject;

  currentDict = term.dict || 'vedra';

  document.getElementById('selected-code-block').style.display = 'none';

  // Auto-search verbatim term
  searchDict(term.verbatim);

  document.getElementById('panel-overlay').classList.add('open');
  document.getElementById('code-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');

  currentDict = dict;

function updateDictButtons() {

  document.getElementById('dict-meddra').classList.toggle('active', currentDict === 'meddra');
  document.getElementById('dict-note').textContent = currentDict === 'vedra' ? 'Veterinary terminology' : 'Human/veterinary cross-reference';
}

function searchDict(query) {
  const q = query.toLowerCase();
  let results;
  if (q.includes('nasal') || q.includes('discharge') && !q.includes('eye'))   results = VEDRA_DB.nasal;
  else if (q.includes('breath') || q.includes('lung') || q.includes('labour')) results = VEDRA_DB.breathing;
  else if (q.includes('eat') || q.includes('appeti') || q.includes('weight'))  results = VEDRA_DB.appetite;
  else if (q.includes('eye') || q.includes('ocular'))                           results = VEDRA_DB.eye;
  else if (q.includes('heart') || q.includes('cardiac') || q.includes('tach')) results = VEDRA_DB.heart;
  else                                                                           results = VEDRA_DB.default;

  const container = document.getElementById('code-results');
  container.innerHTML = `
    <div class="result-section-title">${currentDict === 'vedra' ? 'VeDRA' : 'MedDRA'} — ${results.length} matches for "${query.slice(0,30)}"</div>
    ${results.map((r,i) => {
      const isSelected = selectedCode?.code === r.code;
      const scoreColor = r.score >= 0.85 ? 'var(--green-600)' : r.score >= 0.65 ? 'var(--amber-700)' : 'var(--red-600)';
      return `<div class="code-result-item${isSelected?' selected':''}" onclick="selectCode(${i}, '${query}')">
        <div class="cri-left">
          <div class="cri-term">${r.pt}</div>
          <div class="cri-code">${r.code} · LLT: ${r.llt}</div>
          <div class="cri-path">${r.soc} › ${r.hlgt} › ${r.hlt}</div>
        </div>
        <div class="cri-right">
          <span class="match-score" style="color:${scoreColor}">${Math.round(r.score*100)}%</span>
          <button class="drill-btn" title="Browse hierarchy" onclick="event.stopPropagation()"><i class="ti ti-sitemap"></i></button>
        </div>
      </div>`;
    }).join('')}`;
  
  // Store results for selection
  container._results = results;
}

function selectCode(idx, query) {
  const results = document.getElementById('code-results')._results;
  const r = results[idx];
  selectedCode = r;

  // Highlight selected
  document.querySelectorAll('.code-result-item').forEach((el,i) => {

  document.getElementById('selected-code-block').style.display = 'block';

  term.conflict   = false;

  render();
}

// ── Auto-code ─────────────────────────────────────────────────────────────
const AUTO_CODE_RULES = [
  { keywords:['nasal','discharge','snot','mucus'],       llt:'Mucopurulent nasal discharge',  pt:'Nasal discharge',          hlt:'Nasal signs',               soc:'Respiratory, thoracic and mediastinal disorders', code:'10028738', conf:0.91 },
  { keywords:['eye','ocular','lacrimal','tear'],          llt:'Eye discharge bovine',          pt:'Ocular discharge',         hlt:'Discharge signs',           soc:'Eye disorders',                                   code:'10030302', conf:0.95 },
  { keywords:['heart','tachycard','rapid pulse','bpm'],  llt:'Heart rate increased',          pt:'Tachycardia',              hlt:'Tachycardia group',         soc:'Cardiac disorders',                               code:'10043071', conf:0.88 },
  { keywords:['weight','loss','thin','emaciat'],         llt:'Body weight decreased bovine',  pt:'Weight decreased',         hlt:'Weight changes',            soc:'Metabolism and nutrition disorders',              code:'10047895', conf:0.86 },
  { keywords:['breath','lung','respiratory','wheez'],    llt:'Adventitious breath sounds',    pt:'Adventitious breath sounds',hlt:'Auscultatory signs',        soc:'Respiratory, thoracic and mediastinal disorders', code:'10001233', conf:0.74 },
  { keywords:['eat','appeti','anorexi','feed','ingest'], llt:'Not eating bovine',             pt:'Decreased appetite',       hlt:'Anorexia group',            soc:'Gastrointestinal disorders',                      code:'10011968', conf:0.83 },
  { keywords:['antibiotic','amox','tulath','enro'],      llt:'Antibiotic therapy prior',      pt:'Prior antibiotic use',     hlt:'Antimicrobial history',     soc:'Surgical and medical procedures',                 code:'10003483', conf:0.79 },
  { keywords:['fever','pyrex','temperatur','hot'],       llt:'Febrile episode bovine',        pt:'Pyrexia',                  hlt:'Fever disorders',           soc:'General disorders and admin site conditions',     code:'10037660', conf:0.90 },
  { keywords:['injection','site','swelling','local'],    llt:'ISR swelling bovine',           pt:'Injection site reaction',  hlt:'Local tissue reactions',    soc:'Skin and subcutaneous tissue disorders',          code:'10022095', conf:0.88 },
];

function matchTerm(verbatim) {
  const v = verbatim.toLowerCase();
  let best = null, bestScore = 0;
  for (const rule of AUTO_CODE_RULES) {
    const hits = rule.keywords.filter(kw => v.includes(kw)).length;
    if (hits > 0) {
      const score = Math.round((rule.conf * (0.7 + 0.3 * hits / rule.keywords.length)) * 100) / 100;
      if (score > bestScore) { bestScore = score; best = { ...rule, conf: score }; }
    }
  }
  return best;
}

async function autoCodeAll() {
  const btn = document.querySelector('[onclick="autoCodeAll()"]');
  const pending = TERMS.filter(t => t.status === 'pending');
  if (!pending.length) { alert('No pending terms to auto-code.'); return; }

  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 0.8s linear infinite;font-size:14px"></i> Auto-coding…';
  btn.disabled = true;

  if (!document.querySelector('#spin-style')) {
    const s = document.createElement('style');
    s.id = 'spin-style';
    s.textContent = '@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}';
    document.head.appendChild(s);
  }

  let coded = 0, review = 0, unmatched = 0;
  for (const term of pending) {
    await new Promise(r => setTimeout(r, 180));
    const match = matchTerm(term.verbatim);
    if (match) {
      term.llt = match.llt; term.pt = match.pt; term.hlt = match.hlt;
      term.soc = match.soc; term.code = match.code;
      term.codedBy = 'Auto'; term.autoConf = match.conf;
      term.status  = match.conf >= 0.80 ? 'coded' : 'review';
      term.conflict = match.conf < 0.80;
      match.conf >= 0.80 ? coded++ : review++;
    } else { unmatched++; }
    render();
  }

  btn.innerHTML = '<i class="ti ti-refresh"></i> Auto-code all';
  btn.disabled = false;
  alert(`Auto-coding complete.\n\n✓ ${coded} coded (≥80% confidence)\n⚠ ${review} flagged for review (<80%)\n— ${unmatched} could not be matched`);
}


let sortField = null;
let sortDir = 'none';

function doSort(ci) {
  const fields = ['verbatim','subject','species','llt','pt','hlt','soc','code','status'];
  const fk = fields[ci] || 'verbatim';

  if (sortField === fk) {
    sortDir = sortDir === 'none' ? 'asc' : sortDir === 'asc' ? 'desc' : 'none';
  } else {
    sortField = fk;
    sortDir = 'asc';
  }

  if (sortDir !== 'none') {
    TERMS.sort((a, b) => {
      const av = a[fk] || '';
      const bv = b[fk] || '';
      return sortDir === 'asc'
        ? av.localeCompare(bv, undefined, {numeric: true})
        : bv.localeCompare(av, undefined, {numeric: true});
    });
  }

  render();

  // Update icons after render (fresh DOM)
  document.querySelectorAll('.list-table thead th').forEach((h, i) => {
    const ic = h.querySelector('.sort-icon');
    if (!ic) return;
    if (i === ci && sortDir !== 'none') {
      ic.className = `ti ti-arrow-${sortDir === 'asc' ? 'up' : 'down'} sort-icon`;
      ic.style.color = 'var(--blue-600)';
    } else {
      ic.className = 'ti ti-arrows-sort sort-icon';
      ic.style.color = 'transparent';
    }
  });
}

</script>
