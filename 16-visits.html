<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arken EDC — Today's Visits</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --color-nav-bg:#1A1F2E;--color-nav-hover:#2C3248;--color-nav-icon:#8aafc8;
  --color-page-bg:#FBFBFB;--color-surface:#FFFFFF;
  --color-border:#E8E8E6;--color-border-subtle:#F0F0EE;
  --color-text-primary:#2C2D33;--color-text-secondary:#4F535B;
  --color-text-tertiary:#6D7480;--color-text-placeholder:#C4C4C2;
  --color-hover-bg:#F0F0EE;--color-cta-bg:#1A1F2E;--color-cta-hover:#2C3248;
  --amber-50:#FFF8E7;--amber-100:#FFF1CC;--amber-200:#F5B830;--amber-700:#8A5C00;
  --red-50:#FFF0F0;--red-100:#FFE4E4;--red-200:#EC8585;--red-600:#B52626;
  --green-50:#EEFAF4;--green-200:#58BC88;--green-600:#1A6B47;
  --blue-50:#E8F4FF;--blue-200:#7AB8EE;--blue-600:#1760A8;
  --slate-50:#EEF1F6;--slate-200:#8AA0B8;--slate-600:#3D5A78;
  --font-sans:'Roboto',system-ui,sans-serif;--font-mono:'Roboto Mono',monospace;
  --text-xs:11px;--text-sm:12px;--text-base:14px;--text-lg:16px;--text-3xl:24px;
  --weight-regular:400;--weight-medium:500;--weight-bold:700;
  --radius-sm:2px;--radius-md:4px;--radius-lg:6px;--radius-full:9999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --duration-fast:120ms;--ease-default:cubic-bezier(0.16,1,0.3,1);
  --tracking-caps:0.07em;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--text-base);color:var(--color-text-primary);background:var(--color-page-bg);-webkit-font-smoothing:antialiased}

/* ─── Shell ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidenav{width:74px;background:var(--color-nav-bg);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;gap:2px;flex-shrink:0}
.nav-logo{width:30px;height:30px;border-radius:var(--radius-md);background:var(--color-nav-hover);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-3)}
.nav-logo span{font-size:var(--text-base);font-weight:700;color:#fff;letter-spacing:-0.02em}
.nav-item{width:100%;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--color-nav-icon);cursor:pointer;transition:background var(--duration-fast);padding:4px 0}
.nav-item:hover{background:var(--color-nav-hover);color:#fff}
.nav-item.active{background:var(--color-nav-hover);color:#fff}
.nav-item i{font-size:20px}.nav-label{font-size:11px;font-weight:500;color:inherit;text-align:center}
.nav-spacer{flex:1}.nav-sep{width:100%;height:1px;background:rgba(255,255,255,0.08);margin:var(--space-2) 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:56px;background:var(--color-nav-bg);display:flex;align-items:center;padding:0 var(--space-5);gap:var(--space-3);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.06)}
.tb-study{background:var(--color-nav-hover);color:#fff;font-size:var(--text-base);font-weight:500;padding:7px var(--space-4);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:none;background:transparent;color:#fff;cursor:pointer}
.tb-icon i{font-size:20px}
.tb-role{background:var(--color-nav-hover);color:#fff;font-size:var(--text-sm);font-weight:500;padding:3px var(--space-2);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:#3D5A78;color:#EEF1F6;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}

/* ─── Page layout ── */
.page-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}

.page-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border);background:var(--color-surface);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.page-title-group{display:flex;align-items:baseline;gap:var(--space-3)}
.page-title{font-size:var(--text-3xl);font-weight:500}
.page-date{font-size:var(--text-sm);color:var(--color-text-tertiary);font-family:var(--font-mono)}

/* Urgency summary in header */
.urgency-summary{display:flex;align-items:center;gap:var(--space-4);font-size:var(--text-sm)}
.urg-stat{display:flex;align-items:center;gap:var(--space-1)}
.urg-count{font-family:var(--font-mono);font-weight:700}
.urg-count.overdue{color:var(--red-600)}
.urg-count.due{color:var(--amber-700)}
.urg-count.upcoming{color:var(--color-text-secondary)}
.urg-label{color:var(--color-text-tertiary)}
.urg-divider{width:1px;height:16px;background:var(--color-border)}

/* Filter bar */
.filter-bar{padding:var(--space-3) var(--space-5);background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:var(--space-3);flex-shrink:0}
.search-box{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);min-width:220px}
.search-box i{font-size:14px;color:var(--color-text-placeholder);flex-shrink:0}
.search-box input{border:none;outline:none;font-size:var(--text-sm);font-family:var(--font-sans);color:var(--color-text-primary);background:transparent;flex:1}
.search-box input::placeholder{color:var(--color-text-placeholder)}
.filter-select{height:32px;padding:0 24px 0 var(--space-2);font-size:var(--text-sm);font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='8' height='12' viewBox='0 0 8 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L1 11' stroke='%236D7480' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;outline:none}
.row-count{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-left:auto}

/* ─── TABLE ── */
.table-wrap{flex:1;overflow-y:auto}
.visits-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}

.visits-table thead th{
  position:sticky;top:0;z-index:5;
  background:var(--color-surface);
  padding:var(--space-2) var(--space-3);
  text-align:left;
  font-size:var(--text-xs);font-weight:500;
  text-transform:uppercase;letter-spacing:var(--tracking-caps);
  color:var(--color-text-tertiary);
  border-bottom:1px solid var(--color-border);
  white-space:nowrap;
  cursor:pointer;user-select:none;
}
.visits-table thead th:first-child{padding-left:var(--space-5)}
.visits-table thead th:last-child{padding-right:var(--space-5);text-align:right}
.visits-table thead th .sort-icon{margin-left:3px;font-size:12px;color:transparent;transition:color var(--duration-fast)}
.visits-table thead th:hover .sort-icon{color:var(--color-text-placeholder)}
.visits-table thead th.sort-asc .sort-icon,
.visits-table thead th.sort-desc .sort-icon{color:var(--blue-600)}

/* Row tints by urgency */
.visits-table tbody tr{
  border-bottom:1px solid var(--color-border-subtle);
  cursor:pointer;
  transition:background var(--duration-fast);
}
.visits-table tbody tr.row-overdue{background:#FFF5F5}
.visits-table tbody tr.row-overdue:hover{background:var(--red-100)}
.visits-table tbody tr.row-due{background:#FFFDF5}
.visits-table tbody tr.row-due:hover{background:var(--amber-100)}
.visits-table tbody tr.row-upcoming{background:var(--color-surface)}
.visits-table tbody tr.row-upcoming:hover{background:var(--color-hover-bg)}

.visits-table tbody td{
  padding:var(--space-2) var(--space-3);
  vertical-align:middle;
}
.visits-table tbody td:first-child{padding-left:var(--space-5)}
.visits-table tbody td:last-child{padding-right:var(--space-5)}

/* ── Urgency status cell ── */
.urgency-cell{display:flex;align-items:center;gap:var(--space-2)}
.urgency-badge{display:inline-flex;align-items:center;gap:4px;padding:3px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;border:1px solid;white-space:nowrap}
.ub-overdue{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}
.ub-due    {background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.ub-upcoming{background:var(--slate-50);border-color:var(--slate-200);color:var(--slate-600)}
.ub-days{font-family:var(--font-mono);font-size:10px;font-weight:700}

/* ── Subject cell ── */
.subject-id{font-family:var(--font-mono);font-weight:500;font-size:var(--text-sm);color:var(--color-text-primary)}
.subject-meta{font-size:10px;color:var(--color-text-tertiary);margin-top:1px}

/* ── Visit cell ── */
.visit-ref{font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary)}
.visit-form{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:1px}
.visit-flag{display:flex;align-items:center;gap:3px;font-size:var(--text-xs);color:var(--red-600);font-weight:500;margin-top:3px}
.visit-flag i{font-size:11px;flex-shrink:0}

/* ── Window cells ── */
.window-date{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-secondary);white-space:nowrap}

/* ── Progress cell ── */
.progress-cell{display:flex;flex-direction:column;gap:3px;min-width:100px}
.progress-track{height:3px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden}
.progress-fill{height:100%;border-radius:var(--radius-full);background:var(--blue-600)}
.progress-fill.done{background:var(--green-600)}
.progress-label{font-size:10px;font-family:var(--font-mono);color:var(--color-text-secondary)}
.progress-label.has-pending{color:var(--amber-700);font-weight:500}
.progress-label.overdue-pending{color:var(--red-600);font-weight:500}

/* ── Action cell ── */
.btn-open{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:var(--radius-md);color:var(--color-text-tertiary);cursor:pointer;transition:background var(--duration-fast),color var(--duration-fast)}
.btn-open:hover{background:var(--color-hover-bg);color:var(--color-text-primary)}
.row-overdue td{color:var(--color-text-secondary)}
.row-overdue .subject-id{color:var(--color-text-primary)}
.row-overdue .subject-meta{color:var(--color-text-secondary)}
.row-overdue .visit-ref{color:var(--color-text-primary)}
.row-overdue .window-date{color:var(--color-text-secondary)}
.row-overdue .btn-open{color:var(--red-200)}
.row-overdue .btn-open:hover{background:var(--red-50);color:var(--red-600)}

/* ── Summary bar ── */
.summary-bar{padding:var(--space-2) var(--space-5);background:var(--color-surface);border-top:1px solid var(--color-border);display:flex;align-items:center;gap:var(--space-4);font-size:var(--text-xs);color:var(--color-text-tertiary);flex-shrink:0}
.sv{font-weight:500;color:var(--color-text-primary);font-family:var(--font-mono)}
.sv.warn{color:var(--amber-700)}.sv.crit{color:var(--red-600)}
</style>
</head>
<body>
<div class="shell">
  <nav class="sidenav">
    <div class="nav-logo"><span>Ar</span></div>
    <button class="nav-item"><i class="ti ti-layout-dashboard"></i><span class="nav-label">Dashboard</span></button>
    <button class="nav-item"><i class="ti ti-list"></i><span class="nav-label">Animals</span></button>
    <button class="nav-item active"><i class="ti ti-calendar-event"></i><span class="nav-label">Visits</span></button>
    <button class="nav-item"><i class="ti ti-help-circle"></i><span class="nav-label">Queries</span></button>
    <button class="nav-item"><i class="ti ti-chart-bar"></i><span class="nav-label">Reports</span></button>
    <div class="nav-spacer"></div>
    <div class="nav-sep"></div>
    <button class="nav-item"><i class="ti ti-clipboard-list"></i><span class="nav-label">Audit</span></button>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="tb-study">AK-2401 — BRD Cattle Phase II <i class="ti ti-chevron-right" style="font-size:11px"></i></button>
      <div class="tb-right">
        <button class="tb-icon"><i class="ti ti-bell"></i></button>
        <button class="tb-icon"><i class="ti ti-settings"></i></button>
        <button class="tb-role">CRC <i class="ti ti-chevron-right" style="font-size:10px"></i></button>
        <div class="tb-avatar">ET</div>
      </div>
    </header>

    <div class="page-wrap">
      <div class="page-header">
        <div class="page-title-group">
          <h1 class="page-title">Today's visits</h1>
          <span class="page-date" id="hdr-date"></span>
        </div>

      </div>

      <div class="filter-bar">
        <div class="search-box"><i class="ti ti-search"></i><input type="search" placeholder="Search subject, visit, site…" oninput="doSearch(this.value)"></div>
        <select class="filter-select" onchange="render()">
          <option>All sites</option>
          <option>Austin</option>
          <option>Dallas</option>
          <option>Houston</option>
        </select>
        <select class="filter-select" id="urgency-filter" onchange="render()">
          <option value="all">All urgency</option>
          <option value="overdue">Overdue only</option>
          <option value="due">Due today</option>
          <option value="upcoming">Upcoming</option>
        </select>
        <span class="row-count" id="row-count"></span>
      </div>

      <div class="table-wrap">
        <table class="visits-table" id="vtable">
          <thead>
            <tr>
              <th onclick="doSort(0)">Status <i class="ti ti-arrows-sort sort-icon"></i></th>
              <th onclick="doSort(1)">Subject <i class="ti ti-arrows-sort sort-icon"></i></th>
              <th onclick="doSort(2)">Visit <i class="ti ti-arrows-sort sort-icon"></i></th>
              <th onclick="doSort(3)">Site <i class="ti ti-arrows-sort sort-icon"></i></th>
              <th onclick="doSort(4)">Window from <i class="ti ti-arrows-sort sort-icon"></i></th>
              <th onclick="doSort(5)">Window to <i class="ti ti-arrows-sort sort-icon"></i></th>
              <th onclick="doSort(6)">Progress <i class="ti ti-arrows-sort sort-icon"></i></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="vtbody"></tbody>
        </table>
      </div>

      <div class="summary-bar" id="summary-bar"></div>
    </div>
  </div>
</div>

<script>
const TODAY = new Date('2026-05-30');
const fmtShort = d => new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const diffDays = d => Math.round((new Date(d) - TODAY) / 86400000);

const VISITS = [
  // Overdue
  { id:'AUSB1P1-01', meta:'F · 4yr · Hereford', site:'Austin',
    visitRef:'V3', visitForm:'Physical exam',
    wFrom:'2026-05-20', wTo:'2026-05-24',
    formsTotal:6, formsDone:0,
    flag:'Protocol deviation — visit window exceeded' },
  { id:'AUSB1P2-03', meta:'F · 5yr · Hereford', site:'Austin',
    visitRef:'V3', visitForm:'Physical exam',
    wFrom:'2026-05-21', wTo:'2026-05-25',
    formsTotal:6, formsDone:2, flag:null },
  { id:'DALB1P1-01', meta:'M · 3yr · Angus', site:'Dallas',
    visitRef:'V2', visitForm:'Baseline',
    wFrom:'2026-05-22', wTo:'2026-05-26',
    formsTotal:5, formsDone:0,
    flag:'Missing consent re-sign' },
  { id:'AUSB2P1-02', meta:'M · 3yr · Angus', site:'Austin',
    visitRef:'V2', visitForm:'Baseline',
    wFrom:'2026-05-23', wTo:'2026-05-27',
    formsTotal:5, formsDone:5, flag:null },

  // Due today
  { id:'AUSB1P1-02', meta:'M · 3yr · Angus', site:'Austin',
    visitRef:'V3', visitForm:'Physical exam',
    wFrom:'2026-05-28', wTo:'2026-06-01',
    formsTotal:6, formsDone:3, flag:null },
  { id:'AUSB1P1-04', meta:'M · 2yr · Angus', site:'Austin',
    visitRef:'V3', visitForm:'Physical exam',
    wFrom:'2026-05-29', wTo:'2026-06-02',
    formsTotal:6, formsDone:0, flag:null },
  { id:'DALB1P1-02', meta:'F · 4yr · Hereford', site:'Dallas',
    visitRef:'V4', visitForm:'Follow-up',
    wFrom:'2026-05-27', wTo:'2026-05-31',
    formsTotal:7, formsDone:4, flag:null },
  { id:'HOUB1P1-01', meta:'F · 3yr · Hereford', site:'Houston',
    visitRef:'V2', visitForm:'Baseline',
    wFrom:'2026-05-30', wTo:'2026-06-03',
    formsTotal:5, formsDone:0, flag:null },

  // Upcoming
  { id:'AUSB2P1-03', meta:'F · 4yr · Hereford', site:'Austin',
    visitRef:'V3', visitForm:'Physical exam',
    wFrom:'2026-06-01', wTo:'2026-06-05',
    formsTotal:6, formsDone:0, flag:null },
  { id:'AUSB3P1-01', meta:'F · 2yr · Hereford', site:'Austin',
    visitRef:'V2', visitForm:'Baseline',
    wFrom:'2026-06-01', wTo:'2026-06-05',
    formsTotal:5, formsDone:0, flag:null },
  { id:'DALB2P1-01', meta:'M · 3yr · Angus', site:'Dallas',
    visitRef:'V3', visitForm:'Physical exam',
    wFrom:'2026-06-03', wTo:'2026-06-07',
    formsTotal:6, formsDone:0, flag:null },
  { id:'HOUB1P1-02', meta:'M · 5yr · Angus', site:'Houston',
    visitRef:'V4', visitForm:'Follow-up',
    wFrom:'2026-06-04', wTo:'2026-06-08',
    formsTotal:7, formsDone:0, flag:null },
];

function classify(v) {
  const to = new Date(v.wTo), from = new Date(v.wFrom);
  if (to < TODAY) return 'overdue';
  if (from <= TODAY && to >= TODAY) return 'due';
  return 'upcoming';
}

// Priority order for sorting
const PRIORITY = { overdue:0, due:1, upcoming:2 };

let search = '';
const sortSt = {};

function filtered() {
  const uf = document.getElementById('urgency-filter')?.value || 'all';
  return VISITS
    .filter(v => {
      const bucket = classify(v);
      const urgMatch = uf === 'all' || bucket === uf;
      const srch = !search || [v.id, v.visitRef, v.visitForm, v.site].join(' ').toLowerCase().includes(search.toLowerCase());
      return urgMatch && srch;
    })
    .sort((a, b) => {
      // Default: overdue first, then due, then upcoming; within overdue sort by most overdue first
      const pa = PRIORITY[classify(a)], pb = PRIORITY[classify(b)];
      if (pa !== pb) return pa - pb;
      return new Date(a.wTo) - new Date(b.wTo);
    });
}

function makeUrgencyBadge(v) {
  const bucket = classify(v);
  if (bucket === 'overdue') {
    const d = Math.round((TODAY - new Date(v.wTo)) / 86400000);
    return `<span class="urgency-badge ub-overdue"><i class="ti ti-alert-circle" style="font-size:11px"></i> Overdue · <span class="ub-days">${d}d</span></span>`;
  }
  if (bucket === 'due') {
    const left = Math.round((new Date(v.wTo) - TODAY) / 86400000);
    return `<span class="urgency-badge ub-due"><i class="ti ti-clock" style="font-size:11px"></i> Due today${left === 0 ? ' · closes' : ' · '+left+'d left'}</span>`;
  }
  const opens = diffDays(v.wFrom);
  return `<span class="urgency-badge ub-upcoming"><i class="ti ti-calendar" style="font-size:11px"></i> In ${opens}d</span>`;
}

function makeProgress(v, bucket) {
  const pct = v.formsTotal > 0 ? Math.round((v.formsDone/v.formsTotal)*100) : 0;
  const pending = v.formsTotal - v.formsDone;
  const done = v.formsDone === v.formsTotal;
  const lblCls = done ? '' : bucket === 'overdue' ? 'overdue-pending' : 'has-pending';
  const lblText = done
    ? `All ${v.formsTotal} forms done`
    : `${pending} pending · ${v.formsDone}/${v.formsTotal}`;
  return `<div class="progress-cell">
    <div class="progress-label ${lblCls}">${lblText}</div>
    <div class="progress-track"><div class="progress-fill${done?' done':''}" style="width:${pct}%"></div></div>
  </div>`;
}

function render() {
  const rows = filtered();
  const tbody = document.getElementById('vtbody');

  tbody.innerHTML = rows.map(v => {
    const bucket = classify(v);
    const flagHtml = v.flag
      ? `<div class="visit-flag"><i class="ti ti-alert-triangle"></i>${v.flag}</div>` : '';
    return `<tr class="row-${bucket}" onclick="alert('Opening: ${v.visitRef} · ${v.visitForm} for ${v.id}')">
      <td>${makeUrgencyBadge(v)}</td>
      <td>
        <div class="subject-id">${v.id}</div>
        <div class="subject-meta">${v.meta}</div>
      </td>
      <td>
        <div class="visit-ref">${v.visitRef} · ${v.visitForm}</div>
        ${flagHtml}
      </td>
      <td style="color:var(--color-text-secondary);font-size:var(--text-sm)">${v.site}</td>
      <td><span class="window-date">${fmtShort(v.wFrom)}</span></td>
      <td><span class="window-date">${fmtShort(v.wTo)}</span></td>
      <td>${makeProgress(v, bucket)}</td>
      <td style="text-align:right">
        <button class="btn-open" title="Open visit" onclick="event.stopPropagation()"><i class="ti ti-arrow-right" style="font-size:16px"></i></button>
      </td>
    </tr>`;
  }).join('');

  // Urgency summary in header
  const all = VISITS;
  const ov = all.filter(v=>classify(v)==='overdue').length;
  const du = all.filter(v=>classify(v)==='due').length;
  const up = all.filter(v=>classify(v)==='upcoming').length;
  document.getElementById('urg-summary').innerHTML = `
    <div class="urg-stat"><span class="urg-count overdue">${ov}</span><span class="urg-label">overdue</span></div>
    <div class="urg-divider"></div>
    <div class="urg-stat"><span class="urg-count due">${du}</span><span class="urg-label">due today</span></div>
    <div class="urg-divider"></div>
    <div class="urg-stat"><span class="urg-count upcoming">${up}</span><span class="urg-label">upcoming</span></div>`;

  document.getElementById('row-count').textContent = rows.length + ' visit' + (rows.length===1?'':'s');

  // Summary bar
  const pending = all.filter(v=>classify(v)!=='upcoming' && v.formsDone < v.formsTotal).length;
  document.getElementById('summary-bar').innerHTML = `
    <div style="display:flex;align-items:center;gap:var(--space-1)"><span>Week of:</span><span class="sv">${TODAY.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span></div>
    <div style="display:flex;align-items:center;gap:var(--space-1)"><span>Overdue:</span><span class="sv crit">${ov}</span></div>
    <div style="display:flex;align-items:center;gap:var(--space-1)"><span>Due today:</span><span class="sv warn">${du}</span></div>
    <div style="display:flex;align-items:center;gap:var(--space-1)"><span>Upcoming 7d:</span><span class="sv">${up}</span></div>
    <div style="display:flex;align-items:center;gap:var(--space-1)"><span>Forms pending:</span><span class="sv warn">${pending}</span></div>`;
}

function doSearch(v) { search = v; render(); }

function doSort(ci) {
  const tbl = document.getElementById('vtable');
  const ths = tbl.querySelectorAll('thead th');
  const key = 'v' + ci;
  const prev = sortSt[key] || 'none';
  const next = prev==='none'?'desc':prev==='desc'?'asc':'none';
  sortSt[key] = next;
  ths.forEach(h => {
    h.classList.remove('sort-asc','sort-desc');
    const ic = h.querySelector('.sort-icon');
    if (ic) ic.className = 'ti ti-arrows-sort sort-icon';
  });
  if (next !== 'none') {
    ths[ci].classList.add(next==='asc'?'sort-asc':'sort-desc');
    const ic = ths[ci].querySelector('.sort-icon');
    if (ic) ic.className = (next==='asc'?'ti ti-arrow-up':'ti ti-arrow-down') + ' sort-icon';
    const keys = ['_urgency','id','visitRef','site','wFrom','wTo','formsDone'];
    const k = keys[ci] || 'id';
    VISITS.sort((a,b) => {
      const av = k==='_urgency' ? PRIORITY[classify(a)] : String(a[k]||'');
      const bv = k==='_urgency' ? PRIORITY[classify(b)] : String(b[k]||'');
      if (typeof av === 'number') return next==='asc' ? av-bv : bv-av;
      return next==='asc' ? av.localeCompare(bv,undefined,{numeric:true}) : bv.localeCompare(av,undefined,{numeric:true});
    });
  }
  render();
}

document.getElementById('hdr-date').textContent =
  TODAY.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

render();
</script>
</body>
</html>
