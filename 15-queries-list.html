<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arken EDC — Queries</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --color-nav-bg:#1A1F2E;--color-nav-hover:#2C3248;--color-nav-icon:#8aafc8;
  --color-nav-separator:rgba(255,255,255,0.08);
  --color-page-bg:#FBFBFB;--color-surface:#FFFFFF;
  --color-border:#E8E8E6;--color-border-subtle:#F0F0EE;
  --color-text-primary:#2C2D33;--color-text-secondary:#4F535B;
  --color-text-tertiary:#6D7480;--color-text-placeholder:#C4C4C2;
  --color-hover-bg:#F0F0EE;--color-cta-bg:#1A1F2E;--color-cta-hover:#2C3248;
  --color-focus-ring:#3D8FE0;
  --amber-50:#FFF8E7;--amber-200:#F5B830;--amber-700:#8A5C00;
  --red-50:#FFF0F0;--red-200:#EC8585;--red-600:#B52626;
  --green-50:#EEFAF4;--green-200:#58BC88;--green-600:#1A6B47;
  --blue-50:#E8F4FF;--blue-200:#7AB8EE;--blue-600:#1760A8;
  --purple-50:#F0EEFF;--purple-200:#A9A3EC;--purple-600:#534AB7;
  --slate-50:#EEF1F6;--slate-200:#8AA0B8;--slate-600:#3D5A78;
  --font-sans:'Roboto',system-ui,sans-serif;--font-mono:'Roboto Mono',monospace;
  --text-xs:11px;--text-sm:12px;--text-base:14px;--text-lg:16px;--text-3xl:24px;
  --weight-regular:400;--weight-medium:500;--weight-bold:700;
  --radius-sm:2px;--radius-md:4px;--radius-lg:6px;--radius-full:9999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --duration-fast:120ms;--duration-normal:200ms;--ease-default:cubic-bezier(0.16,1,0.3,1);
  --tracking-caps:0.07em;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--text-base);color:var(--color-text-primary);background:var(--color-page-bg);-webkit-font-smoothing:antialiased}
.shell{display:flex;height:100vh;overflow:hidden}
.sidenav{width:74px;background:var(--color-nav-bg);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;gap:2px;flex-shrink:0}
.nav-logo{width:30px;height:30px;border-radius:var(--radius-md);background:var(--color-nav-hover);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-3)}
.nav-logo span{font-size:var(--text-base);font-weight:700;color:#fff;letter-spacing:-0.02em}
.nav-item{width:100%;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--color-nav-icon);cursor:pointer;transition:background var(--duration-fast);padding:4px 0}
.nav-item:hover{background:var(--color-nav-hover);color:#fff}
.nav-item.active{background:var(--color-nav-hover);color:#fff}
.nav-item i{font-size:20px}
.nav-label{font-size:11px;font-weight:500;color:inherit;text-align:center}
.nav-spacer{flex:1}.nav-sep{width:100%;height:1px;background:var(--color-nav-separator);margin:var(--space-2) 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:56px;background:var(--color-nav-bg);display:flex;align-items:center;padding:0 var(--space-4);gap:var(--space-3);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.06)}
.tb-study{background:var(--color-nav-hover);color:#fff;font-size:var(--text-base);font-weight:500;padding:8px var(--space-4);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:none;background:transparent;color:#fff;cursor:pointer}
.tb-icon i{font-size:20px}
.tb-role{background:var(--color-nav-hover);color:#fff;font-size:var(--text-sm);font-weight:500;padding:3px var(--space-2);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:#3D5A78;color:#EEF1F6;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
.page-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border);background:var(--color-surface);flex-shrink:0}
.page-header-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.page-title{font-size:var(--text-3xl);font-weight:500}
.page-actions{display:flex;align-items:center;gap:var(--space-2)}
.btn-primary{display:flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer}
.btn-primary i{font-size:14px}
.btn-secondary{display:flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer}
.btn-secondary i{font-size:14px}
.btn-icon{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:none;border-radius:var(--radius-md);color:var(--color-text-tertiary);cursor:pointer;transition:background var(--duration-fast),color var(--duration-fast)}
.btn-icon:hover{background:var(--color-hover-bg);color:var(--color-text-primary)}
.btn-icon i{font-size:15px}
.status-tabs{display:flex;gap:0;border-bottom:1px solid var(--color-border);background:var(--color-surface);flex-shrink:0;padding:0 var(--space-5)}
.status-tab{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);font-weight:500;color:var(--color-text-tertiary);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color var(--duration-fast);white-space:nowrap}
.status-tab:hover{color:var(--color-text-primary)}
.status-tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);font-size:10px;font-weight:700;font-family:var(--font-mono)}
.tab-count.open{background:var(--amber-50);color:var(--amber-700)}
.tab-count.responded{background:var(--blue-50);color:var(--blue-600)}
.tab-count.resolved{background:var(--green-50);color:var(--green-600)}
.tab-count.closed{background:var(--slate-50);color:var(--slate-600)}
.tab-count.all{background:var(--color-page-bg);color:var(--color-text-secondary);border:1px solid var(--color-border)}
.filter-bar{padding:var(--space-3) var(--space-5);background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;flex-shrink:0}
.search-box{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);min-width:240px}
.search-box i{font-size:14px;color:var(--color-text-placeholder);flex-shrink:0}
.search-box input{border:none;outline:none;font-size:var(--text-sm);font-family:var(--font-sans);color:var(--color-text-primary);background:transparent;flex:1}
.search-box input::placeholder{color:var(--color-text-placeholder)}
.filter-select{height:32px;padding:0 24px 0 var(--space-2);font-size:var(--text-sm);font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='8' height='12' viewBox='0 0 8 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L1 11' stroke='%236D7480' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;outline:none}
.toolbar-count{font-size:var(--text-xs);color:var(--color-text-tertiary);white-space:nowrap;margin-left:auto}
.table-wrap{flex:1;overflow-y:auto}
.query-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.query-table thead th{position:sticky;top:0;z-index:5;background:var(--color-surface);padding:var(--space-2) var(--space-3);text-align:left;font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);border-bottom:1px solid var(--color-border);white-space:nowrap;cursor:pointer;user-select:none}
.query-table thead th:first-child{padding-left:var(--space-5)}
.query-table thead th:last-child{padding-right:var(--space-5)}
.query-table thead th .sort-icon{margin-left:3px;font-size:12px;color:transparent;transition:color var(--duration-fast)}
.query-table thead th:hover .sort-icon{color:var(--color-text-placeholder)}
.query-table thead th.sort-asc .sort-icon,.query-table thead th.sort-desc .sort-icon{color:var(--blue-600)}
.query-table tbody tr{border-bottom:1px solid var(--color-border-subtle);cursor:pointer;transition:background var(--duration-fast)}
.query-table tbody tr:hover{background:var(--color-hover-bg)}
.query-table tbody tr.active-row{background:var(--blue-50)}
.query-table tbody td{padding:var(--space-2) var(--space-3);vertical-align:middle}
.query-table tbody td:first-child{padding-left:var(--space-5)}
.query-table tbody td:last-child{padding-right:var(--space-5)}
.cell-id{font-family:var(--font-mono);font-weight:500;font-size:var(--text-sm);color:var(--color-text-primary)}
.cell-mono{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--color-text-secondary)}
.cell-subject{font-family:var(--font-mono);font-weight:500;font-size:var(--text-sm);color:var(--color-text-primary)}
.q-status{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;border:1px solid;white-space:nowrap}
.qs-open{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.qs-responded{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-600)}
.qs-resolved{background:var(--green-50);border-color:var(--green-200);color:var(--green-600)}
.qs-closed{background:var(--slate-50);border-color:var(--slate-200);color:var(--slate-600)}
.q-type{display:inline-flex;align-items:center;gap:3px;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;border:1px solid;white-space:nowrap}
.qt-auto{background:var(--purple-50);border-color:var(--purple-200);color:var(--purple-600)}
.qt-manual{background:var(--slate-50);border-color:var(--slate-200);color:var(--slate-600)}
.field-cell{max-width:260px}
.field-name-row{font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field-code{font-family:var(--font-mono);font-size:10px;color:var(--color-text-tertiary);background:var(--color-page-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 4px;display:inline-block;margin-left:4px}
.field-val{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:var(--radius-sm);border:1px solid;display:inline-block;margin-top:2px}
.fv-flag{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.fv-ok{background:var(--green-50);border-color:var(--green-200);color:var(--green-600)}
.query-text-cell{max-width:240px}
.query-text{font-size:var(--text-sm);color:var(--color-text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.days-cell{font-family:var(--font-mono);font-size:var(--text-sm);font-weight:500}
.days-ok{color:var(--color-text-secondary)}
.days-warn{color:var(--amber-700)}
.days-crit{color:var(--red-600)}
.user-chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--text-xs)}
.user-av{width:20px;height:20px;border-radius:50%;background:var(--slate-50);border:1px solid var(--slate-200);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--slate-600);flex-shrink:0}
.user-av.auto-av{background:var(--slate-200);color:var(--slate-600)}
.user-name{font-weight:500;color:var(--color-text-primary)}
.user-role{display:inline-flex;align-items:center;padding:1px 5px;border-radius:var(--radius-sm);background:var(--color-page-bg);border:1px solid var(--color-border);font-size:10px;font-weight:500;color:var(--color-text-secondary)}

.summary-bar{padding:var(--space-2) var(--space-5);background:var(--color-surface);border-top:1px solid var(--color-border);display:flex;align-items:center;gap:var(--space-4);font-size:var(--text-xs);color:var(--color-text-tertiary);flex-shrink:0}
.summary-stat{display:flex;align-items:center;gap:var(--space-1)}
.sv{font-weight:500;color:var(--color-text-primary);font-family:var(--font-mono)}
.sv.warn{color:var(--amber-700)}.sv.crit{color:var(--red-600)}
/* Panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(14,18,28,0.32);z-index:200;backdrop-filter:blur(1px)}
.panel-overlay.open{display:block}
.slide-panel{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--color-surface);border-left:1px solid var(--color-border);display:flex;flex-direction:column;z-index:201;transform:translateX(100%);transition:transform var(--duration-normal) var(--ease-default);box-shadow:-8px 0 24px rgba(14,18,28,0.10)}
.slide-panel.open{transform:translateX(0)}
.panel-header{display:flex;align-items:flex-start;justify-content:space-between;padding:var(--space-4);border-bottom:1px solid var(--color-border);flex-shrink:0;gap:var(--space-3)}
.panel-title{font-size:var(--text-lg);font-weight:500;color:var(--color-text-primary);margin-bottom:3px}
.panel-qid{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-tertiary)}
.panel-close{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-md);border:none;background:none;cursor:pointer;color:var(--color-text-tertiary);flex-shrink:0}
.panel-close:hover{background:var(--color-hover-bg);color:var(--color-text-primary)}
.panel-close i{font-size:18px}
.status-bar{padding:var(--space-2) var(--space-5);border-bottom:1px solid var(--color-border);flex-shrink:0;display:flex;align-items:center;gap:var(--space-3)}
.status-bar-lbl{font-size:var(--text-xs);color:var(--color-text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps)}
.field-ctx{padding:var(--space-3) var(--space-4);background:var(--color-page-bg);border-bottom:1px solid var(--color-border);flex-shrink:0}
.fc-lbl{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-bottom:3px;text-transform:uppercase;letter-spacing:var(--tracking-caps);font-weight:500}
.fc-code{font-family:var(--font-mono);font-size:var(--text-xs);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 5px;color:var(--color-text-tertiary);margin-left:var(--space-2)}
.thread-body{flex:1;overflow-y:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.message{display:flex;flex-direction:column;gap:var(--space-2)}
.msg-hdr{display:flex;align-items:center;gap:var(--space-2);flex-wrap:nowrap;overflow:hidden}
.msg-av{width:26px;height:26px;border-radius:50%;background:#3D5A78;color:#EEF1F6;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.msg-av.auto{background:var(--slate-200);color:var(--slate-600)}
.msg-author{font-size:var(--text-sm);font-weight:500;color:var(--color-text-primary);white-space:nowrap;flex-shrink:0}
.msg-role{display:inline-flex;align-items:center;padding:1px 5px;border-radius:var(--radius-sm);background:var(--color-page-bg);border:1px solid var(--color-border);font-size:10px;font-weight:500;color:var(--color-text-secondary);white-space:nowrap;flex-shrink:0}
.msg-ts{font-size:10px;font-family:var(--font-mono);color:var(--color-text-tertiary);margin-left:auto;white-space:nowrap;flex-shrink:0}
.msg-bubble{background:var(--color-page-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);border-top-left-radius:var(--radius-sm);padding:var(--space-3);font-size:var(--text-sm);line-height:1.5;color:var(--color-text-primary)}
.msg-bubble.auto{background:var(--amber-50);border-color:var(--amber-200);border-top-left-radius:var(--radius-lg)}
.msg-bubble.response{background:var(--blue-50);border-color:var(--blue-200)}
.msg-bubble.resolved{background:var(--green-50);border-color:var(--green-200)}
.thread-evt{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;justify-content:center}
.thread-evt-line{flex:1;height:1px;background:var(--color-border-subtle)}
.thread-evt-lbl{font-size:10px;color:var(--color-text-tertiary);white-space:nowrap;padding:0 var(--space-2)}
.msg-corr{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-xs);flex-wrap:wrap}
.corr-lbl{color:var(--color-text-tertiary);font-weight:500;white-space:nowrap}
.corr-old{font-family:var(--font-mono);color:var(--color-text-primary);text-decoration:line-through;text-decoration-color:#B8BDC9}
.corr-new{font-family:var(--font-mono);color:var(--green-600)}
.corr-reason{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:4px;line-height:1.4;font-style:italic}
.compose-area{border-top:1px solid var(--color-border);padding:var(--space-4);flex-shrink:0;display:flex;flex-direction:column;gap:var(--space-3)}
.compose-hint{font-size:var(--text-xs);color:var(--color-text-tertiary);display:flex;align-items:center;gap:var(--space-1)}
.compose-hint i{font-size:12px}
.compose-ta{width:100%;min-height:80px;padding:var(--space-3);font-family:var(--font-sans);font-size:var(--text-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);resize:vertical;outline:none;line-height:1.5}
.compose-ta:focus{border-color:var(--color-focus-ring);box-shadow:0 0 0 3px rgba(61,143,224,0.25)}
.compose-ta::placeholder{color:var(--color-text-placeholder)}
.compose-actions{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2)}
.btn-resolve{height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="shell">
  <nav class="sidenav">
    <div class="nav-logo"><span>Ar</span></div>
    <button class="nav-item"><i class="ti ti-layout-dashboard"></i><span class="nav-label">Dashboard</span></button>
    <button class="nav-item"><i class="ti ti-list"></i><span class="nav-label">Animals</span></button>
    <button class="nav-item"><i class="ti ti-calendar-event"></i><span class="nav-label">Visits</span></button>
    <button class="nav-item active"><i class="ti ti-help-circle"></i><span class="nav-label">Queries</span></button>
    <button class="nav-item"><i class="ti ti-chart-bar"></i><span class="nav-label">Reports</span></button>
    <div class="nav-spacer"></div>
    <div class="nav-sep"></div>
    <button class="nav-item"><i class="ti ti-clipboard-list"></i><span class="nav-label">Audit</span></button>
  </nav>
  <div class="main">
    <header class="topbar">
      <button class="tb-study">AK-2401 — BRD Cattle Phase II <i class="ti ti-chevron-right" style="font-size:11px"></i></button>
      <div class="tb-right">
        <button class="tb-icon"><i class="ti ti-bell"></i></button>
        <button class="tb-icon"><i class="ti ti-settings"></i></button>
        <button class="tb-role">CRA <i class="ti ti-chevron-right" style="font-size:10px"></i></button>
        <div class="tb-avatar">JR</div>
      </div>
    </header>
    <div class="page-wrap">
      <div class="page-header">
        <div class="page-header-top">
          <h1 class="page-title">Queries</h1>
          <div class="page-actions">
            <button class="btn-secondary"><i class="ti ti-download"></i> Export</button>
          </div>
        </div>

  {id:'Q-010',status:'open',type:'manual',subject:'DALB1P1-01',form:'Visit 2 — Day 7',field:'Treatment date',code:'TX_DATE_V2',val:'2026-05-20',corr:null,text:'Treatment date outside visit window (Day 5–9). Please confirm.',by:'J. Reyes',byRole:'CRA',to:'E. Tron',toRole:'CRC',raised:'2026-05-22',days:8,desc:'Awaiting CRC response',thread:[{av:'JR',cls:'',auth:'J. Reyes',role:'CRA',ts:'2026-05-22T13:00Z',bc:'auto',txt:'Treatment date outside visit window.'}],btns:[{lbl:'Respond',cls:'btn-resolve'}]},
  {id:'Q-011',status:'responded',type:'auto',subject:'AUSB1P1-02',form:'Visit 1 — PE',field:'Rectal temperature',code:'RECTAL_TEMP_V1',val:'40.2 °C',corr:null,text:'Value 40.2°C slightly above normal range. Confirm if clinically significant.',by:'Edit check',byRole:'Auto',to:'E. Tron',toRole:'CRC',raised:'2026-05-15',days:15,desc:'Awaiting CRA review',thread:[{av:'AU',cls:'auto',auth:'Edit check',role:'Auto',ts:'2026-05-15T09:00Z',bc:'auto',txt:'Temperature slightly elevated.'},{type:'evt',lbl:'Responded · 2026-05-16T08:00Z'},{av:'ET',cls:'',auth:'E. Tron',role:'CRC',ts:'2026-05-16T08:00Z',bc:'response',txt:'Animal mildly febrile. PI informed. No protocol deviation.'}],btns:[{lbl:'Request clarification',cls:'btn-secondary'},{lbl:'Resolve',cls:'btn-resolve'}]},

  {id:'Q-014',status:'responded',type:'manual',subject:'AUSB1P1-01',form:'Visit 2 — Day 7',field:'Visit date',code:'VISIT_DATE_V2',val:'2026-05-11',corr:null,text:'Visit date falls outside window (Day 5–9). Please confirm.',by:'J. Reyes',byRole:'CRA',to:'E. Tron',toRole:'CRC',raised:'2026-05-13',days:17,desc:'Awaiting CRA review',thread:[{av:'JR',cls:'',auth:'J. Reyes',role:'CRA',ts:'2026-05-13T09:00Z',bc:'auto',txt:'Visit date outside window.'},{type:'evt',lbl:'Responded · 2026-05-14T10:00Z'},{av:'ET',cls:'',auth:'E. Tron',role:'CRC',ts:'2026-05-14T10:00Z',bc:'response',txt:'Visit one day early due to logistics. PI approved. Documented in site file.'}],btns:[{lbl:'Request clarification',cls:'btn-secondary'},{lbl:'Resolve',cls:'btn-resolve'}]}
];

let tab='all',activeRow=null,search='';
const sortSt={};

function filtered(){
  return QS.filter(q=>{
    const tm=tab==='all'||q.status===tab;
    const sm=!search||[q.id,q.subject,q.form,q.field,q.text,q.code].join(' ').toLowerCase().includes(search.toLowerCase());
    return tm&&sm;
  });
}

function dcls(d){if(d===0)return 'days-ok';if(d>14)return 'days-crit';if(d>7)return 'days-warn';return 'days-ok';}
function initials(n){return n.split(' ').map(w=>w[0]).join('')}

function renderTable(){
  const rows=filtered();
  const sm={open:'qs-open',responded:'qs-responded',resolved:'qs-resolved',closed:'qs-closed'};
  document.getElementById('qtbody').innerHTML=rows.map(q=>{
    const dc=dcls(q.days);
    const ds=q.days===0?'—':q.days+'d';
    const sl=q.status.charAt(0).toUpperCase()+q.status.slice(1);
    const valHtml=q.corr
      ?`<span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-primary);text-decoration:line-through;text-decoration-color:#B8BDC9">${q.val}</span><span style="color:var(--color-text-placeholder);margin:0 5px;font-size:11px">→</span><span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--green-600)">${q.corr}</span>`
      :`<span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--amber-700)">${q.val}</span>`;
    return `<tr class="${activeRow===q.id?'active-row':''}" onclick="openPanel('${q.id}')">
      <td><span class="cell-id">${q.id}</span></td>
      <td><span class="q-status ${sm[q.status]}">${sl}</span></td>
      <td><span class="cell-subject">${q.subject}</span></td>
      <td>
        <span onclick="event.stopPropagation();alert('Navigating to: '+q.form+' · '+q.subject)" style="font-size:var(--text-sm);color:var(--color-text-primary);text-decoration:underline;text-underline-offset:2px;cursor:pointer" title="Open form">${q.form}</span>
      </td>
      <td>
        <div style="font-size:var(--text-sm);color:var(--color-text-secondary)">${q.field}</div>
        <span class="field-code" style="margin-left:0">${q.code}</span>
      </td>
      <td>${valHtml}</td>
      <td class="query-text-cell"><span class="query-text">${q.text}</span></td>
      <td><div class="user-chip"><div class="user-av ${q.byRole==='Auto'?'auto-av':''}">${initials(q.by)}</div><span class="user-name">${q.by}</span><span class="user-role">${q.byRole}</span></div></td>
      <td><div class="user-chip"><div class="user-av">${initials(q.to)}</div><span class="user-name">${q.to}</span><span class="user-role">${q.toRole}</span></div></td>
      <td><span class="cell-mono">${q.raised}</span></td>
      <td><span class="days-cell ${dc}">${ds}</span></td>
    </tr>`;
  }).join('');

  const c={all:0,open:0,responded:0,resolved:0,closed:0};
  QS.forEach(q=>{c.all++;c[q.status]++;});
  ['all','open','responded','resolved','closed'].forEach(k=>document.getElementById('cnt-'+k).textContent=c[k]);
  document.getElementById('row-count').textContent=rows.length+' quer'+(rows.length===1?'y':'ies');

  const op=QS.filter(q=>q.status==='open');
  const ov=op.filter(q=>q.days>14);
  const wn=op.filter(q=>q.days>7&&q.days<=14);
  document.getElementById('summary-bar').innerHTML=`
    <div class="summary-stat"><span>Total:</span><span class="sv">${QS.length}</span></div>
    <div class="summary-stat"><span>Open:</span><span class="sv warn">${op.length}</span></div>
    <div class="summary-stat"><span>&gt;7 days:</span><span class="sv warn">${wn.length}</span></div>
    <div class="summary-stat"><span>&gt;14 days:</span><span class="sv crit">${ov.length}</span></div>
    <div class="summary-stat"><span>Auto:</span><span class="sv">${QS.filter(q=>q.type==='auto').length}</span></div>
    <div class="summary-stat"><span>Manual:</span><span class="sv">${QS.filter(q=>q.type==='manual').length}</span></div>`;
}

function openPanel(qid){
  activeRow=qid;renderTable();
  const q=QS.find(x=>x.id===qid);if(!q)return;
  const sm={open:'qs-open',responded:'qs-responded',resolved:'qs-resolved',closed:'qs-closed'};
  document.getElementById('p-qid').textContent=q.id;
  const sb=document.getElementById('p-status');
  sb.textContent=q.status.charAt(0).toUpperCase()+q.status.slice(1);
  sb.className='q-status '+sm[q.status];
  document.getElementById('p-status-desc').textContent=q.desc;
  document.getElementById('p-field').textContent=q.field+' · '+q.form;
  document.getElementById('p-code').textContent=q.code;
  const diff=document.getElementById('p-diff');
  diff.innerHTML=q.corr
    ?`<span style="color:var(--color-text-primary);text-decoration:line-through;text-decoration-color:#B8BDC9">${q.val}</span><span style="color:var(--color-text-placeholder);margin:0 6px">→</span><span style="color:var(--green-600)">${q.corr}</span>`
    :`<span style="color:var(--amber-700)">${q.val}</span>`;
  const th=document.getElementById('p-thread');
  th.innerHTML=q.thread.map(m=>{
    if(m.type==='evt')return`<div class="thread-evt"><div class="thread-evt-line"></div><span class="thread-evt-lbl">${m.lbl}</span><div class="thread-evt-line"></div></div>`;
    const corr=m.corr?`<div class="msg-corr"><span class="corr-lbl">Value corrected:</span><span class="corr-old">${m.corr.old}</span><span style="color:var(--color-text-placeholder);margin:0 4px">→</span><span class="corr-new">${m.corr.nw}</span></div><div class="corr-reason">${m.corr.reason}</div>`:'';
    return`<div class="message"><div class="msg-hdr"><div class="msg-av ${m.cls}">${m.av}</div><span class="msg-author">${m.auth}</span><span class="msg-role">${m.role}</span><span class="msg-ts">${m.ts}</span></div><div class="msg-bubble ${m.bc}">${m.txt}${corr}</div></div>`;
  }).join('');
  const cp=document.getElementById('p-compose');
  if(!q.btns.length){cp.innerHTML=`<div class="compose-hint"><i class="ti ti-lock"></i> Closed — read only</div>`;
  }else{
    const btns=q.btns.map(b=>`<button class="${b.cls}">${b.lbl}${b.note?` <span style="font-size:10px;opacity:0.7">(${b.note})</span>`:''}</button>`).join('');
    cp.innerHTML=`<div class="compose-hint"><i class="ti ti-pencil" style="font-size:12px"></i> ${q.status==='open'?'Responding as CRC':'Reviewing as CRA'}</div><textarea class="compose-ta" placeholder="${q.status==='open'?'Provide a response…':'Request clarification or resolve…'}"></textarea><div class="compose-actions">${btns}</div>`;
  }
  setTimeout(()=>{th.scrollTop=th.scrollHeight;},50);
  document.getElementById('poverlay').classList.add('open');
  document.getElementById('spanel').classList.add('open');
}

function closePanel(){
  document.getElementById('poverlay').classList.remove('open');
  document.getElementById('spanel').classList.remove('open');
  activeRow=null;renderTable();
}

function filterTab(btn,t){
  document.querySelectorAll('.status-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');tab=t;renderTable();
}

function doSearch(v){search=v;renderTable();}

function doSort(ci){
  const tbl=document.getElementById('qtable');
  const ths=tbl.querySelectorAll('thead th');
  const key='q'+ci;
  const prev=sortSt[key]||'none';
  const next=prev==='none'?'desc':prev==='desc'?'asc':'none';
  sortSt[key]=next;
  ths.forEach(h=>{h.classList.remove('sort-asc','sort-desc');const ic=h.querySelector('.sort-icon');if(ic)ic.className='ti ti-arrows-sort sort-icon';});
  if(next!=='none'){
    ths[ci].classList.add(next==='asc'?'sort-asc':'sort-desc');
    const ic=ths[ci].querySelector('.sort-icon');
    if(ic)ic.className=(next==='asc'?'ti ti-arrow-up':'ti ti-arrow-down')+' sort-icon';
    const keys=['id','status','subject','form','form','text','by','to','raised','days'];
    const k=keys[ci]||'id';
    QS.sort((a,b)=>{const av=String(a[k]||'');const bv=String(b[k]||'');return next==='asc'?av.localeCompare(bv,undefined,{numeric:true}):bv.localeCompare(av,undefined,{numeric:true});});
  }
  renderTable();
}

renderTable();
</script>
