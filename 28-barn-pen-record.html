<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arken EDC — Pen Record · Pen 1</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>

/* ─── Tokens ── */
:root {
  --color-nav-bg:#1A1F2E; --color-nav-hover:#2C3248; --color-nav-icon:#8aafc8;
  --color-nav-separator:rgba(255,255,255,0.08);
  --color-page-bg:#FBFBFB; --color-surface:#FFFFFF;
  --color-border:#E8E8E6; --color-border-subtle:#F0F0EE;
  --color-text-primary:#2C2D33; --color-text-secondary:#4F535B;
  --color-text-tertiary:#6D7480; --color-text-placeholder:#C4C4C2;
  --color-link:#3D4A5C; --color-hover-bg:#F0F0EE;
  --color-cta-bg:#1A1F2E; --color-cta-hover:#2C3248;
  --color-focus-ring:#3D8FE0;
  --amber-50:#FFF8E7; --amber-200:#F5B830; --amber-700:#8A5C00;
  --orange-700:#A33A08;
  --red-50:#FFF0F0; --red-200:#EC8585; --red-600:#B52626;
  --green-50:#EEFAF4; --green-200:#58BC88; --green-400:#28A062; --green-600:#1A6B47;
  --blue-50:#E8F4FF; --blue-200:#7AB8EE; --blue-600:#1760A8;
  --slate-50:#EEF1F6; --slate-200:#8AA0B8; --slate-600:#3D5A78;
  --purple-50:#F0EEFF; --purple-200:#A9A3EC; --purple-600:#534AB7;
  --font-sans:'Roboto',system-ui,sans-serif;
  --font-mono:'Roboto Mono',monospace;
  --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:16px; --text-3xl:24px;
  --weight-medium:500; --weight-bold:700;
  --radius-sm:2px; --radius-md:4px; --radius-lg:6px; --radius-full:9999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
  --duration-fast:120ms; --ease-default:cubic-bezier(0.16,1,0.3,1);
  --tracking-caps:0.07em;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--text-base);color:var(--color-text-primary);background:var(--color-page-bg);-webkit-font-smoothing:antialiased}

/* ─── Shell ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidenav{width:74px;background:var(--color-nav-bg);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;gap:2px;flex-shrink:0}
.nav-logo{width:30px;height:30px;border-radius:var(--radius-md);background:var(--color-nav-hover);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-3)}
.nav-logo span{font-size:var(--text-base);font-weight:700;color:#fff}
.nav-item{width:100%;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--color-nav-icon);cursor:pointer;transition:background var(--duration-fast);padding:4px 0;position:relative}
.nav-item:hover,.nav-item.active{background:var(--color-nav-hover);color:#fff}
.nav-item i{font-size:20px} .nav-label{font-size:11px;font-weight:500;color:inherit;text-align:center}
.nav-badge{position:absolute;top:6px;right:18px;min-width:14px;height:14px;padding:0 3px;border-radius:var(--radius-full);background:var(--red-600);color:#fff;font-size:9px;font-weight:700;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center}
.nav-spacer{flex:1} .nav-sep{width:100%;height:1px;background:var(--color-nav-separator);margin:var(--space-2) 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* ─── Topbar ── */
.topbar{height:56px;background:var(--color-nav-bg);display:flex;align-items:center;padding:0 var(--space-5);gap:var(--space-3);flex-shrink:0}
.tb-study{background:var(--color-nav-hover);color:#fff;font-size:var(--text-base);font-weight:500;padding:7px var(--space-4);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer}
.tb-study i{font-size:11px;opacity:0.7}
.tb-site{color:#fff;font-size:var(--text-base);display:flex;align-items:center;gap:3px;cursor:pointer;border:none;background:none;font-family:var(--font-sans);font-weight:500}
.tb-site:hover{color:rgba(255,255,255,0.7)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:none;background:transparent;color:#fff;cursor:pointer}
.tb-icon:hover{background:var(--color-nav-hover)}
.tb-icon i{font-size:20px}
.tb-role{background:var(--color-nav-hover);color:#fff;font-size:var(--text-sm);font-weight:500;padding:3px var(--space-2);border-radius:var(--radius-md);border:1px solid #525D73;cursor:pointer;display:flex;align-items:center;gap:4px}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:#3D5A78;color:#EEF1F6;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}

/* ─── Body wrap: sidebar + content side by side ── */
.body-wrap{flex:1;display:flex;min-height:0;overflow:hidden}

/* ─────────────────────────────────────────────────────────────────────────────
   FORM SIDEBAR — exact from 09-form-sidebar
   220px · white · 1px right border · scrollable
───────────────────────────────────────────────────────────────────────────── */
.form-sidebar{
  width:220px;background:var(--color-surface);border-right:1px solid var(--color-border);
  display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
  padding:var(--space-3) var(--space-3) var(--space-6);
}
.sidebar-label{font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);margin-bottom:var(--space-2);padding:0 var(--space-1)}
.form-item{display:flex;align-items:center;justify-content:space-between;padding:var(--space-1) var(--space-2);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text-primary);cursor:pointer;margin-bottom:1px;gap:var(--space-2);min-height:32px;border:none;background:transparent;width:100%;text-align:left;transition:background var(--duration-fast)}
.form-item:hover{background:var(--color-hover-bg)}
.form-item.done{color:var(--green-600)}
.form-item.active{background:var(--blue-50);color:var(--blue-600);font-weight:700}
.form-item.active:hover{background:#dbeeff}
.form-item-label{flex:1;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-item-right{display:flex;align-items:center;gap:var(--space-1);flex-shrink:0}

/* Issue badge */
.issue-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:var(--radius-full);font-size:9px;font-weight:700;font-family:var(--font-mono);line-height:1;border:1px solid}
.issue-badge.warning{background:#FFF8E7;border-color:#8A5C00;color:#8A5C00}
.issue-badge.alert  {background:#FFF0E8;border-color:#A33A08;color:#A33A08}

/* Status icons */
.status-empty{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--color-text-placeholder);flex-shrink:0}
.status-final{width:16px;height:16px;border-radius:50%;background:var(--green-50);border:1.5px solid var(--green-600);color:var(--green-600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.status-final i{font-size:10px}
.status-active{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--blue-600);flex-shrink:0}
.status-queried{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--amber-700);flex-shrink:0}
.status-inwork{width:16px;height:16px;flex-shrink:0;display:block;overflow:hidden}
.status-reviewed{width:16px;height:16px;flex-shrink:0;display:block;overflow:hidden}

/* Sub-form group */
.subform-group{border-left:2px solid var(--blue-200);margin-left:14px;padding-left:var(--space-2);margin-bottom:1px}
.form-item.sub{font-size:var(--text-sm);min-height:28px;border-radius:var(--radius-sm)}
.form-item.sub.active-sub{background:var(--slate-50);color:var(--blue-600);font-weight:700}

/* Sidebar separator */
.sidebar-sep{height:1px;background:var(--color-border-subtle);margin:var(--space-2) var(--space-1)}

/* ─────────────────────────────────────────────────────────────────────────────
   FORM CONTENT — exact from 09-form-sidebar
───────────────────────────────────────────────────────────────────────────── */
.form-content{flex:1;padding:var(--space-5);overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-5)}

/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-sm);color:var(--color-text-tertiary);flex-wrap:wrap}
.bc-link{color:var(--color-link);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none;font-size:var(--text-sm);font-family:var(--font-sans);padding:0}
.bc-link:hover{color:var(--color-text-primary)}
.bc-sep{color:var(--color-text-placeholder);font-size:12px}

/* ─────────────────────────────────────────────────────────────────────────────
   RECORD HEADER — mirrors animal-header from 10-subject-header
   Shows level name (Barn / Pen) in mono + status badge + meta row
───────────────────────────────────────────────────────────────────────────── */
.record-header{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.record-id{font-size:20px;font-weight:500;font-family:var(--font-mono);color:var(--color-text-primary);line-height:1.2}
.record-switch{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:none;background:none;color:var(--color-text-tertiary);cursor:pointer;border-radius:var(--radius-sm);transition:color var(--duration-fast),background var(--duration-fast);padding:0}
.record-switch:hover{color:var(--color-text-primary);background:var(--color-hover-bg)}
.record-switch i{font-size:14px}
.record-badge{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:500;border:1px solid;white-space:nowrap}
.badge-active  {background:var(--blue-50);  border-color:var(--blue-200);  color:var(--blue-600)}
.badge-hold    {background:var(--amber-50); border-color:var(--amber-200); color:var(--amber-700)}
.badge-closed  {background:var(--slate-50); border-color:var(--slate-200); color:var(--slate-600)}
.badge-pending {background:var(--slate-50); border-color:var(--slate-200); color:var(--slate-600)}

.record-meta{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;font-size:var(--text-sm);color:var(--color-text-secondary)}
.meta-sep{color:var(--color-text-placeholder);font-size:11px;line-height:1}
.meta-item{white-space:nowrap}
.meta-item.mono{font-family:var(--font-mono)}
.meta-item.tag{display:inline-flex;align-items:center;gap:4px;padding:1px var(--space-2);border-radius:var(--radius-sm);background:var(--color-page-bg);border:1px solid var(--color-border);font-size:var(--text-xs);font-weight:500;color:var(--color-text-secondary)}

/* Form header */
.form-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:var(--space-4);border-bottom:1px solid var(--color-border);gap:var(--space-4);flex-wrap:wrap}
.form-title{font-size:var(--text-lg);font-weight:500;color:var(--color-text-primary)}
.form-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.btn-ghost{font-size:var(--text-sm);font-weight:500;color:var(--color-link);background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px}
.btn-ghost span{text-decoration:underline;text-underline-offset:2px}
.btn-ghost:hover{color:var(--color-text-primary)}
.btn-ghost i{font-size:13px}
.btn-secondary{font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);height:32px;padding:0 var(--space-3);border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background var(--duration-fast),border-color var(--duration-fast)}
.btn-secondary:hover{border-color:#c8c8c6;background:var(--color-hover-bg)}
.btn-secondary i{font-size:14px}
.btn-primary{font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);height:32px;padding:0 var(--space-3);border-radius:var(--radius-md);border:none;background:var(--color-cta-bg);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background var(--duration-fast)}
.btn-primary:hover{background:var(--color-cta-hover)}
.btn-primary i{font-size:14px}

/* Form sections + fields */
.section-title{font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);padding-bottom:var(--space-2);border-bottom:1px solid var(--color-border-subtle);margin-bottom:var(--space-4)}
.field-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-4)}
.field-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4)}
.field-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)}
.field{display:flex;flex-direction:column;gap:var(--space-1)}
.field.span-2{grid-column:span 2}
.field.span-3{grid-column:span 3}
.field.span-4{grid-column:span 4}
.field-label{font-size:var(--text-sm);color:var(--color-text-secondary)}
.field-row{display:flex;align-items:center;gap:var(--space-1)}
.field-input{flex:1;height:32px;padding:0 var(--space-3);font-family:var(--font-mono);font-size:var(--text-base);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);outline:none;transition:border-color var(--duration-fast)}
.field-input:focus{border-color:var(--color-focus-ring);box-shadow:0 0 0 3px rgba(61,143,224,0.18)}
.field-input.queried{background:var(--amber-50);border-color:var(--amber-700);color:#7A4F00}
.field-input.sdv{background:var(--green-50);border-color:var(--green-600);color:#0E4427}
.field-input[readonly]{background:var(--color-page-bg);color:var(--color-text-secondary);cursor:default}
.field-select{flex:1;height:32px;padding:0 28px 0 var(--space-3);font-size:var(--text-sm);font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='8' height='12' viewBox='0 0 8 12' fill='none'%3E%3Cpath d='M1 1L6 6L1 11' stroke='%236D7480' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;outline:none}
.field-textarea{flex:1;padding:var(--space-2) var(--space-3);font-size:var(--text-sm);font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);outline:none;resize:vertical;min-height:72px;line-height:1.5}
.field-textarea:focus{border-color:var(--color-focus-ring)}
.field-hint{font-size:var(--text-xs);color:var(--color-text-tertiary)}
.field-hint.queried{color:var(--amber-700)}
.field-hint.sdv{color:var(--green-600)}

/* Flag button */
.flag-btn{width:24px;height:24px;flex-shrink:0;border:none;background:none;cursor:pointer;border-radius:var(--radius-md);color:var(--color-text-placeholder);display:flex;align-items:center;justify-content:center;transition:color var(--duration-fast),background var(--duration-fast)}
.flag-btn i{font-size:16px}
.flag-btn:hover{color:var(--color-text-tertiary);background:var(--color-hover-bg)}

/* Demo switcher for level type */
.demo-bar{height:32px;background:var(--color-border-subtle);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-5);gap:var(--space-2);flex-shrink:0}
.demo-label-txt{font-size:var(--text-xs);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-right:var(--space-1)}
.demo-btn{height:22px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--text-xs);font-family:var(--font-sans);color:var(--color-text-secondary);cursor:pointer;transition:all var(--duration-fast)}
.demo-btn:hover{border-color:var(--blue-200);color:var(--blue-600)}
.demo-btn.active{background:var(--color-cta-bg);border-color:var(--color-cta-bg);color:#fff;font-weight:500}
</style>
</head>
<body>
<div class="shell">

  <!-- ── Sidenav ── -->
  <nav class="sidenav">
    <div class="nav-logo"><span>Ar</span></div>
    <button class="nav-item" title="Dashboard"><i class="ti ti-layout-dashboard"></i><span class="nav-label">Dashboard</span></button>
    <button class="nav-item active" title="Data Entry"><i class="ti ti-database-import"></i><span class="nav-label">Data Entry</span></button>
    <button class="nav-item" title="Animals"><i class="ti ti-paw"></i><span class="nav-label">Animals</span></button>
    <button class="nav-item" title="Queries"><i class="ti ti-help-circle"></i><span class="nav-label">Queries</span><span class="nav-badge">4</span></button>
    <button class="nav-item" title="Visits"><i class="ti ti-calendar-event"></i><span class="nav-label">Visits</span></button>
    <button class="nav-item" title="Reports"><i class="ti ti-chart-bar"></i><span class="nav-label">Reports</span></button>
    <div class="nav-spacer"></div>
    <div class="nav-sep"></div>
    <button class="nav-item" title="Audit trail"><i class="ti ti-clipboard-list"></i><span class="nav-label">Audit</span></button>
  </nav>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">
      <button class="tb-study">AK-2401 — BRD Cattle Phase II <i class="ti ti-chevron-right"></i></button>
      <button class="tb-site" id="tb-site-btn">Austin Research Center <i class="ti ti-chevron-down" style="font-size:11px;opacity:0.7"></i></button>
      <div class="tb-right">
        <button class="tb-icon"><i class="ti ti-bell"></i></button>
        <button class="tb-role">CRC <i class="ti ti-chevron-right" style="font-size:10px"></i></button>
        <div class="tb-avatar">ET</div>
      </div>
    </header>

    <!-- Demo bar — level switcher for prototype -->
    <div class="demo-bar">
      <span class="demo-label-txt">Level:</span>
      <button class="demo-btn" onclick="setLevel('barn')">Barn record (Barn A)</button>
      <button class="demo-btn active" onclick="setLevel('pen')">Pen record (Pen 1)</button>
    </div>

    <!-- Body: sidebar + form content -->
    <div class="body-wrap">

      <!-- ── FORM SIDEBAR ── -->
      <nav class="form-sidebar" id="form-sidebar" aria-label="Form navigator">
        <!-- rendered by JS -->
      </nav>

      <!-- ── FORM CONTENT ── -->
      <div class="form-content" id="form-content">
        <!-- rendered by JS -->
      </div>

    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   DATA
══════════════════════════════════════════════════════════════════════════ */
const LEVELS = {

            { label:'Wed reading (°C)', value:'21.4',   state:'queried', hint:'Query — exceeds 21°C threshold, verify' },
            { label:'Thu reading (°C)', value:'',       state:'normal', placeholder:'—' },
            { label:'Fri reading (°C)', value:'',       state:'normal', placeholder:'—' },
            { label:'Sat reading (°C)', value:'',       state:'normal', placeholder:'—' },
            { label:'Sun reading (°C)', value:'',       state:'normal', placeholder:'—' },
            { label:'Weekly avg (°C)',  value:'19.8',   state:'sdv', hint:'SDV complete', readonly:true },

            { label:'Battery status',    value:'OK',     state:'normal', select:['OK','Low — replace soon','Replaced this week'] },

/* ══════════════════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════════════════ */
var currentLevel = 'pen';

/* ══════════════════════════════════════════════════════════════════════════
   STATUS ICON HTML
══════════════════════════════════════════════════════════════════════════ */
function statusIcon(s, active) {
  if (active) return '<div class="status-active"></div>';
  switch(s) {
    case 'final':
      return '<div class="status-final"><i class="ti ti-check"></i></div>';
    case 'inwork':
      return '<svg class="status-inwork" width="16" height="16" viewBox="2 2 16 16" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M11.1423 17.9188C15.0196 17.3647 18.0003 14.0303 18.0003 9.99983C18.0003 5.58165 14.4186 2 10.0004 2C6.30023 2 3.18677 4.51215 2.27257 7.92394C2.0948 8.58662 2 9.28327 2 10.0021C2 14.4202 5.58165 18.0019 9.99983 18.0019C10.3887 18.0019 10.7712 17.9741 11.1452 17.9205L11.1423 17.9188ZM16.8574 9.99983C16.8574 6.21282 13.7874 3.14283 10.0004 3.14283C9.88547 3.14283 9.77117 3.14566 9.6576 3.15125C7.76505 4.82631 6.57193 7.27373 6.57193 9.99983C6.57193 12.7259 7.76505 15.1734 9.65759 16.8484C9.77117 16.854 9.88547 16.8568 10.0004 16.8568C13.7874 16.8568 16.8574 13.7868 16.8574 9.99983Z" fill="#4492CB"/></svg>';
    case 'reviewed':
      return '<svg class="status-reviewed" width="16" height="16" viewBox="2 2 16 16" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.3522 16.8489C13.9788 16.6689 16.8641 13.6712 16.8641 10C16.8641 6.32673 13.9756 3.32779 10.3462 3.15084C12.2407 4.826 13.4353 7.27477 13.4353 10.0025C13.4353 12.7274 12.2433 15.1738 10.3522 16.8489ZM7.16743 2.51848C4.14722 3.66218 2 6.58161 2 10.0025C2 14.035 4.9835 17.3706 8.86352 17.9224C8.86513 17.9215 8.86674 17.9206 8.86836 17.9196C9.24018 17.9726 9.62024 18 10.0067 18C14.425 18 18.0067 14.4183 18.0067 10C18.0067 5.58172 14.425 2 10.0067 2C9.00682 2 8.0498 2.18343 7.16743 2.51848Z" fill="#BF65D5"/></svg>';
    default:
      return '<div class="status-empty"></div>';
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER SIDEBAR
══════════════════════════════════════════════════════════════════════════ */
function renderSidebar(data) {
  var html = '<div class="sidebar-label">Forms</div>';

  data.sidebar.forEach(function(item, idx) {
    if (item.sep) { html += '<div class="sidebar-sep"></div>'; return; }

    var hasKids = item.children && item.children.length > 0;
    var itemCls = 'form-item' + (item.active ? ' active' : '') + (item.status === 'final' ? ' done' : '');
    var grpId   = 'grp-' + idx;

    html += '<button class="' + itemCls + '" onclick="toggleGroup(\'' + grpId + '\')">';
    html += '<span class="form-item-label">' + item.label + '</span>';
    html += '<div class="form-item-right">';
    if (item.queries) html += '<span class="issue-badge warning">' + item.queries + '</span>';
    html += statusIcon(item.status, item.active);
    html += '</div></button>';

    if (hasKids) {
      var borderColor = item.status === 'final' ? 'var(--green-400)' : 'var(--slate-200)';
      html += '<div class="subform-group" id="' + grpId + '" style="border-left-color:' + borderColor + '">';
      item.children.forEach(function(child) {
        var subCls = 'form-item sub' + (child.activeSub ? ' active-sub' : '') + (child.status === 'final' ? ' done' : '');
        html += '<button class="' + subCls + '">';
        html += '<span class="form-item-label">' + child.label + '</span>';
        html += '<div class="form-item-right">' + statusIcon(child.status, child.activeSub) + '</div>';
        html += '</button>';
      });
      html += '</div>';
    }
  });

  document.getElementById('form-sidebar').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER CONTENT
══════════════════════════════════════════════════════════════════════════ */
function renderContent(data) {
  var html = '';

  /* Breadcrumb */
  html += '<nav class="breadcrumb">';
  data.breadcrumb.forEach(function(crumb, i) {
    if (i < data.breadcrumb.length - 1) {
      html += '<button class="bc-link">' + crumb + '</button>';
      html += '<span class="bc-sep"><i class="ti ti-chevron-right" style="font-size:11px"></i></span>';
    } else {
      html += '<span>' + crumb + '</span>';
    }
  });
  html += '</nav>';

  /* Record header */
  html += '<div class="record-header">';
  html += '<span class="record-id"><i class="ti ' + data.icon + '" style="font-size:18px;vertical-align:-3px;margin-right:6px;color:var(--color-text-tertiary)"></i>' + data.id + '</span>';
  html += '<button class="record-switch" title="Switch ' + data.levelTag.toLowerCase() + '"><i class="ti ti-arrows-exchange"></i></button>';
  html += '<span class="record-badge badge-' + data.status + '">' + data.status.charAt(0).toUpperCase() + data.status.slice(1) + '</span>';
  /* Meta inline — same row, after the badge */
  html += '<span style="font-size:var(--text-sm);color:var(--color-text-secondary)">';
  data.meta.forEach(function(m, i) {
    if (i > 0) html += '<span style="color:var(--color-text-placeholder);margin:0 5px;font-size:11px">·</span>';
    html += m;
  });
  html += '</span>';
  html += '</div>';

  /* Form header */
  var af = data.activeForm;
  html += '<div class="form-header">';
  html += '<h1 class="form-title">' + af.title + '</h1>';
  html += '<div class="form-actions">';
  html += '<button class="btn-secondary">Remarks: Queries, SDV mode <i class="ti ti-chevron-down" style="font-size:11px;opacity:0.7"></i></button>';
  html += '<button class="btn-secondary">Verify all</button>';
  html += '<button class="btn-primary">Mark SDV complete</button>';
  html += '<button class="btn-secondary" style="padding:0 var(--space-2)"><i class="ti ti-dots-vertical" style="font-size:16px"></i></button>';
  html += '</div></div>';

  /* Form sections */
  af.sections.forEach(function(sec) {
    html += '<div>';
    html += '<div class="section-title">' + sec.heading + '</div>';
    html += '<div class="field-grid-' + sec.grid + '">';
    sec.fields.forEach(function(f) {
      var span = f.span ? ' span-' + f.span : '';
      html += '<div class="field' + span + '">';
      html += '<label class="field-label">' + f.label + '</label>';
      html += '<div class="field-row">';

      if (f.textarea) {
        html += '<textarea class="field-textarea"' + (f.placeholder ? ' placeholder="' + f.placeholder + '"' : '') + '>' + (f.value || '') + '</textarea>';
      } else if (f.select) {
        html += '<select class="field-select">';
        f.select.forEach(function(opt) {
          html += '<option' + (opt === f.value ? ' selected' : '') + '>' + opt + '</option>';
        });
        html += '</select>';
      } else {
        var inputCls = 'field-input' + (f.state === 'queried' ? ' queried' : f.state === 'sdv' ? ' sdv' : '') + (f.mono !== false ? '' : '');
        var ro = (f.readonly ? ' readonly' : '');
        var ph = (f.placeholder ? ' placeholder="' + f.placeholder + '"' : '');
        html += '<input class="' + inputCls + '" type="text" value="' + (f.value || '') + '"' + ro + ph + '>';
        if (!f.readonly && !f.textarea && !f.select) {
          var flagColor = f.state === 'queried' ? 'style="color:var(--orange-700)"' : '';
          html += '<button class="flag-btn" ' + flagColor + '><i class="ti ti-flag' + (f.state === 'queried' ? '-filled' : '') + '"></i></button>';
        }
      }

      html += '</div>';
      if (f.hint) {
        html += '<span class="field-hint ' + (f.state === 'queried' ? 'queried' : f.state === 'sdv' ? 'sdv' : '') + '">' + f.hint + '</span>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  });

  document.getElementById('form-content').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════════════
   TOGGLE GROUP (sidebar expand/collapse)
══════════════════════════════════════════════════════════════════════════ */
function toggleGroup(id) {
  var grp = document.getElementById(id);
  if (!grp) return;
  grp.style.display = grp.style.display === 'none' ? '' : 'none';
}

/* ══════════════════════════════════════════════════════════════════════════
   SET LEVEL
══════════════════════════════════════════════════════════════════════════ */
function setLevel(level) {
  currentLevel = level;
  document.querySelectorAll('.demo-btn').forEach(function(b, i) {
    b.classList.toggle('active', ['barn','pen'][i] === level);
  });
  renderSidebar(LEVELS[level]);
  renderContent(LEVELS[level]);
}

/* ── Boot ── */
setLevel('pen');
</script>
