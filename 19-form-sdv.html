<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arken EDC — Query Thread</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>

/* ─── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --color-nav-bg:#1A1F2E; --color-nav-hover:#2C3248; --color-nav-icon:#8aafc8;
  --color-nav-separator:rgba(255,255,255,0.08);
  --color-page-bg:#FBFBFB; --color-surface:#FFFFFF; --color-border:#E8E8E6;
  --color-border-subtle:#F0F0EE;
  --color-text-primary:#2C2D33; --color-text-secondary:#4F535B;
  --color-text-tertiary:#6D7480; --color-text-placeholder:#C4C4C2;
  --color-link:#3D4A5C; --color-hover-bg:#F0F0EE;
  --color-cta-bg:#1A1F2E; --color-cta-hover:#2C3248;
  --color-focus-ring:#3D8FE0;

  --amber-50:#FFF8E7; --amber-200:#F5B830; --amber-700:#8A5C00;
  --orange-50:#FFF0E8; --orange-200:#F48E50; --orange-700:#A33A08;
  --red-50:#FFF0F0; --red-200:#EC8585; --red-600:#B52626;
  --green-50:#EEFAF4; --green-200:#58BC88; --green-600:#1A6B47;
  --blue-50:#E8F4FF; --blue-200:#7AB8EE; --blue-600:#1760A8;
  --purple-50:#F0EEFF; --purple-200:#A9A3EC; --purple-600:#534AB7;
  --slate-50:#EEF1F6; --slate-200:#8AA0B8; --slate-600:#3D5A78;

  --field-query-bg:#FFF8E7; --field-query-border:#8A5C00;
  --field-clean-bg:#EEFAF4; --field-clean-border:#1A6B47;
  --field-default-bg:#FFFFFF; --field-default-border:#E8E8E6;

  --font-sans:'Roboto',system-ui,sans-serif;
  --font-mono:'Roboto Mono',monospace;
  --text-xs:11px; --text-sm:12px; --text-base:14px;
  --text-lg:16px; --text-xl:18px; --text-3xl:24px;
  --weight-regular:400; --weight-medium:500; --weight-bold:700;
  --radius-sm:2px; --radius-md:4px; --radius-lg:6px; --radius-full:9999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
  --duration-fast:120ms; --duration-normal:200ms;
  --ease-default:cubic-bezier(0.16,1,0.3,1);
  --tracking-caps:0.07em;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--text-base);color:var(--color-text-primary);background:var(--color-page-bg);-webkit-font-smoothing:antialiased}

/* ─── Shell ──────────────────────────────────────────────────────────────── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidenav{width:74px;background:var(--color-nav-bg);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;gap:2px;flex-shrink:0}
.nav-logo{width:30px;height:30px;border-radius:var(--radius-md);background:var(--color-nav-hover);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-3)}
.nav-logo span{font-size:var(--text-base);font-weight:var(--weight-bold);color:#fff;letter-spacing:-0.02em}
.nav-item{width:100%;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--color-nav-icon);border:none;background:transparent;transition:background var(--duration-fast);padding:4px 0}
.nav-item:hover{background:var(--color-nav-hover);color:#fff}
.nav-item.active{background:var(--color-nav-hover);color:#fff}
.nav-item i{font-size:20px} .nav-label{font-size:11px;font-weight:var(--weight-medium);color:inherit;text-align:center}
.nav-spacer{flex:1} .nav-sep{width:100%;height:1px;background:var(--color-nav-separator);margin:var(--space-2) 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:56px;background:var(--color-nav-bg);display:flex;align-items:center;padding:0 var(--space-4);gap:var(--space-3);flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.06)}
.tb-study{background:var(--color-nav-hover);color:#fff;font-size:var(--text-base);font-weight:var(--weight-medium);padding:8px var(--space-4);border-radius:var(--radius-md);display:flex;align-items:center;gap:4px;cursor:pointer;border:1px solid #525D73}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:none;background:transparent;color:#fff;cursor:pointer}
.tb-icon i{font-size:20px}
.tb-role{background:var(--color-nav-hover);color:#fff;font-size:var(--text-sm);font-weight:var(--weight-medium);padding:3px var(--space-2);border-radius:var(--radius-md);display:flex;align-items:center;gap:4px;cursor:pointer;border:1px solid #525D73}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:#3D5A78;color:#EEF1F6;font-size:12px;font-weight:var(--weight-medium);display:flex;align-items:center;justify-content:center;cursor:pointer}

.overflow-wrap{position:relative}
.overflow-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:220px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(14,18,28,0.10);z-index:100;overflow:hidden}
.overflow-menu.open{display:block}
.overflow-item{display:flex;align-items:center;gap:var(--space-2);width:100%;padding:var(--space-2) var(--space-3);font-size:var(--text-sm);font-family:var(--font-sans);color:var(--color-text-primary);background:none;border:none;cursor:pointer;text-align:left;transition:background var(--duration-fast)}
.overflow-item:hover{background:var(--color-hover-bg)}
.overflow-item .item-left{display:flex;align-items:center;gap:var(--space-2)}
.overflow-item i{font-size:15px;color:var(--color-text-tertiary);flex-shrink:0}


/* ── SDV mode overlay ── */
.sdv-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:none;cursor:pointer;flex-shrink:0;border-radius:var(--radius-sm);transition:background var(--duration-fast),color var(--duration-fast);color:var(--color-text-placeholder)}
.sdv-btn:hover{background:var(--blue-50);color:var(--blue-600)}
.sdv-btn.verified{color:var(--blue-600)}
.sdv-btn i{font-size:17px}
.sdv-btn.verified i{color:var(--blue-600)}
.sdv-btns-hidden .sdv-btn{display:none}
/* SDV progress in form header */
.sdv-progress-row{display:flex;align-items:center;gap:var(--space-3);padding:6px var(--space-4);background:var(--blue-50);border-bottom:1px solid var(--blue-200);font-size:var(--text-xs);color:var(--blue-600)}
.sdv-progress-bar{flex:1;height:3px;background:var(--blue-200);border-radius:var(--radius-full);overflow:hidden;max-width:160px}
.sdv-progress-fill{height:100%;background:var(--blue-600);border-radius:var(--radius-full);transition:width 300ms}
.sdv-mode-active .field-row{gap:var(--space-1)}

/* ─── Body ───────────────────────────────────────────────────────────────── */
.body-wrap{flex:1;display:flex;min-height:0;overflow:hidden;position:relative}

/* ─── Form sidebar (minimal) ── */
.form-sidebar{width:220px;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:var(--space-3)}
.sidebar-label{font-size:var(--text-xs);font-weight:var(--weight-medium);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);margin-bottom:var(--space-2);padding:0 var(--space-1)}
.form-item{display:flex;align-items:center;justify-content:space-between;padding:var(--space-1) var(--space-2);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text-primary);cursor:pointer;margin-bottom:1px;gap:var(--space-2);min-height:32px;border:none;background:transparent;width:100%;text-align:left;transition:background var(--duration-fast)}
.form-item:hover{background:var(--color-hover-bg)}
.form-item.active{background:var(--blue-50);color:var(--blue-600);font-weight:var(--weight-bold)}
.form-item-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-final{width:16px;height:16px;border-radius:50%;background:var(--green-50);border:1.5px solid var(--green-600);color:var(--green-600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.status-final i{font-size:10px}
.status-active{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--blue-600);flex-shrink:0}
.status-empty{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--color-text-placeholder);flex-shrink:0}
.issue-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:var(--radius-full);font-size:9px;font-weight:var(--weight-bold);font-family:var(--font-mono);line-height:1;border:1px solid}
.issue-badge.warning{background:var(--amber-50);border-color:var(--amber-700);color:var(--amber-700)}

/* ─── Form content ─────────────────────────────────────────────────────── */
.form-content{flex:1;padding:var(--space-5);overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-5)}
.breadcrumb{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-sm);color:var(--color-text-tertiary)}
.bc-btn{color:var(--color-link);background:none;border:none;font-size:var(--text-sm);cursor:pointer;padding:0}
.bc-btn span{text-decoration:underline;text-underline-offset:2px}
.bc-sep{color:var(--color-text-placeholder);font-size:11px}

/* Subject header */
.subject-header{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.species-icon{font-size:22px;line-height:1;flex-shrink:0}
.subject-id-row{display:flex;align-items:center;gap:var(--space-2)}
.meta-item{white-space:nowrap}
.meta-item.mono{font-family:var(--font-mono)}
.meta-item.group{display:inline-flex;align-items:center;padding:1px var(--space-2);border-radius:var(--radius-sm);background:var(--color-page-bg);border:1px solid var(--color-border);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--color-text-secondary)}
.action-btn{display:flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);border-radius:var(--radius-md);cursor:pointer;transition:background var(--duration-fast),border-color var(--duration-fast);white-space:nowrap}
.action-btn.secondary{background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text-primary)}
.action-btn.secondary:hover{background:var(--color-hover-bg)}
.subject-switch{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:none;background:none;color:var(--color-text-tertiary);cursor:pointer;border-radius:var(--radius-sm);padding:0;flex-shrink:0}
.subject-switch i{font-size:14px}
.subject-id{font-size:var(--text-3xl);font-weight:var(--weight-medium);font-family:var(--font-mono);color:var(--color-text-primary)}
.subject-status{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:var(--weight-medium);border:1px solid;white-space:nowrap}
.status-randomized{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-600)}

/* Form header */
.form-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:var(--space-4);border-bottom:1px solid var(--color-border);gap:var(--space-4)}
.form-title{font-size:var(--text-lg);font-weight:var(--weight-medium)}
.form-actions{display:flex;align-items:center;gap:var(--space-2)}
.btn-primary{display:flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer}
.btn-secondary{display:flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer}
.btn-ghost{display:flex;align-items:center;gap:5px;height:32px;padding:0 var(--space-2);font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);border:none;background:none;color:var(--color-link);cursor:pointer;text-decoration:none}
.btn-ghost span:first-of-type{text-decoration:underline;text-underline-offset:2px}
.btn-ghost:hover{color:var(--color-text-primary)}
.btn-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-secondary);cursor:pointer;font-size:16px;transition:background var(--duration-fast)}
.btn-icon:hover{background:var(--color-hover-bg)}

/* Section + field grid */
.section-title{font-size:var(--text-xs);font-weight:var(--weight-medium);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);padding-bottom:var(--space-2);border-bottom:1px solid var(--color-border-subtle);margin-bottom:var(--space-4)}
.field-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)}
.field{display:flex;flex-direction:column;gap:var(--space-1)}
.field-label{font-size:var(--text-sm);color:var(--color-text-secondary)}
.field-row{display:flex;align-items:center;gap:var(--space-2)}
.field-input{flex:1;height:32px;padding:0 var(--space-3);font-family:var(--font-mono);font-size:var(--text-base);border:1px solid var(--field-default-border);border-radius:var(--radius-md);background:var(--field-default-bg);color:var(--color-text-primary);outline:none}
.field-input.query{background:var(--field-query-bg);border-color:var(--field-query-border);color:#7A4F00}
.field-input.clean{background:var(--field-clean-bg);border-color:var(--field-clean-border);color:var(--green-600)}
.field-hint{font-size:var(--text-xs);color:var(--color-text-tertiary)}
.flag-btn{width:24px;height:24px;flex-shrink:0;border:none;background:none;cursor:pointer;border-radius:var(--radius-md);color:var(--color-text-placeholder);display:flex;align-items:center;justify-content:center;transition:color var(--duration-fast),background var(--duration-fast)}
.flag-btn i{font-size:16px}
.flag-btn.flagged{color:var(--orange-700)}
.flag-btn:hover{color:var(--color-text-tertiary);background:var(--color-hover-bg)}

/* Clickable field hint to open query */
.query-link{color:var(--amber-700);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:var(--weight-regular);line-height:1.4}

/* ─────────────────────────────────────────────────────────────────────────────
   QUERY THREAD PANEL — Component 13
   ─────────────────────────────────────────────────────────────────────────────
   480px slide-in panel, same shell as audit trail.
   Triggered by clicking the flag icon or the query state message on a field.

   Anatomy:
   ┌── Panel header ──────────────────────────────────────────────────────────┐
   │  Query · RECTAL_TEMP_V1               [Q-001 · Open]           [×]      │
   ├── Field context bar ─────────────────────────────────────────────────────┤
   │  Field: Rectal temperature · Current value: 28.5 °C                     │
   ├── Lifecycle track ───────────────────────────────────────────────────────┤
   │  ① Raised ──●── ② Responded ──○── ③ Resolved                           │
   ├── Thread ────────────────────────────────────────────────────────────────┤
   │  [message] [message] [message] …                                         │
   ├── Compose ───────────────────────────────────────────────────────────────┤
   │  [textarea] [Respond / Resolve]                                          │
   └──────────────────────────────────────────────────────────────────────────┘

   Lifecycle states: Raised → Responded → Resolved (→ Closed, DM only)
   ───────────────────────────────────────────────────────────────────────────── */

/* ── Remarks dropdown ── */
.remarks-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(14,18,28,0.10);z-index:100;overflow:hidden}
.remarks-menu.open{display:block}
.remarks-section-label{font-size:10px;font-weight:var(--weight-medium);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-placeholder);padding:var(--space-2) var(--space-3) var(--space-1)}
.remarks-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:var(--space-2) var(--space-3);font-size:var(--text-sm);font-family:var(--font-sans);color:var(--color-text-primary);background:none;border:none;cursor:pointer;text-align:left;transition:background var(--duration-fast)}
.remarks-item:hover{background:var(--color-hover-bg)}
.remarks-item.active-mode{color:var(--blue-600);font-weight:var(--weight-medium)}
.remarks-item .mode-indicator{width:8px;height:8px;border-radius:50%;background:var(--blue-600);flex-shrink:0}

/* Panel overlay + shell */

.panel-overlay.open{display:block}


/* Panel header */




.query-id{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-tertiary)}




/* Query status badge */




.qs-closed   {background:var(--slate-50);border-color:var(--slate-200);color:var(--slate-600)}

/* Field context bar */


.fc-row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}

.fc-code{font-family:var(--font-mono);font-size:var(--text-xs);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 5px;color:var(--color-text-tertiary)}
.fc-value{font-family:var(--font-mono);font-size:var(--text-xs);padding:2px 6px;border-radius:var(--radius-sm);font-weight:var(--weight-medium);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.fc-value.flagged{background:var(--amber-50);border:1px solid var(--amber-200);color:var(--amber-700)}
.fc-value.corrected{background:var(--green-50);border:1px solid var(--green-200);color:var(--green-600)}
.fc-diff-arrow{color:var(--color-text-placeholder);font-size:11px}

/* ── Status bar (replaces lifecycle track) ── */
.status-bar{padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--color-border);flex-shrink:0;display:flex;align-items:center;gap:var(--space-3)}
.status-bar-label{font-size:var(--text-xs);color:var(--color-text-tertiary);font-weight:var(--weight-medium);text-transform:uppercase;letter-spacing:var(--tracking-caps)}


/* ── Thread ── */


/* Message bubble */
.message{display:flex;flex-direction:column;gap:var(--space-2)}
.msg-header{display:flex;align-items:center;gap:var(--space-2);flex-wrap:nowrap;overflow:hidden}














/* Value correction block inside a bubble */
.msg-correction{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-2);padding:var(--space-2) var(--space-3);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-xs);flex-wrap:wrap}
.correction-label{color:var(--color-text-tertiary);font-weight:var(--weight-medium);white-space:nowrap}
.correction-old{font-family:var(--font-mono);color:var(--red-600);text-decoration:line-through;text-decoration-color:var(--red-200)}
.correction-arrow{color:var(--color-text-placeholder)}
.correction-new{font-family:var(--font-mono);color:var(--green-600)}
.correction-reason{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:4px;line-height:1.4;font-style:italic}

/* System event (status change in thread) */
.thread-event{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;justify-content:center}
.thread-event-line{flex:1;height:1px;background:var(--color-border-subtle)}
.thread-event-label{font-size:10px;color:var(--color-text-tertiary);white-space:nowrap;padding:0 var(--space-2)}

/* ── Compose area ── */

.compose-context{font-size:var(--text-xs);color:var(--color-text-tertiary);display:flex;align-items:center;gap:var(--space-1)}
.compose-context i{font-size:12px}





.compose-btns{display:flex;align-items:center;gap:var(--space-2)}
.btn-respond{height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer;transition:background var(--duration-fast)}
.btn-respond:hover{background:var(--color-cta-hover)}
.btn-resolve{height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer;transition:background var(--duration-fast)}
.btn-resolve:hover{background:var(--color-cta-hover)}
.btn-close-query{height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:var(--weight-medium);font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer;transition:background var(--duration-fast)}
.btn-close-query:hover{background:var(--color-cta-hover)}

/* ── Scenario switcher (demo only) ── */

</style>
</head>
<body>
<div class="shell">

  <nav class="sidenav">
    <div class="nav-logo"><span>Ar</span></div>
    <button class="nav-item"><i class="ti ti-layout-dashboard"></i><span class="nav-label">Dashboard</span></button>

              <div class="overflow-menu">
                <button class="overflow-item"><div class="item-left"><i class="ti ti-link"></i> Copy link</div></button>
                <button class="overflow-item"><div class="item-left"><i class="ti ti-calendar-plus"></i> Add unscheduled visit</div></button>
                <button class="overflow-item"><div class="item-left"><i class="ti ti-printer"></i> Print subject summary</div></button>
                <button class="overflow-item"><div class="item-left"><i class="ti ti-download"></i> Export subject data</div></button>
              </div>
            </div>
          </div>
        </div>

        <!-- SDV progress bar — shown only when SDV mode active -->
        <div class="sdv-progress-row" id="sdv-progress-row" style="display:flex">
          <i class="ti ti-circle-check-filled" style="font-size:14px;flex-shrink:0"></i>
          <span>SDV mode active</span>
          <div class="sdv-progress-bar"><div class="sdv-progress-fill" id="sdv-prog" style="width:25%"></div></div>
          <span id="sdv-prog-label" style="font-family:var(--font-mono);font-weight:500">1/4 verified</span>
        </div>

        <!-- Form header -->
        <div class="form-header">
          <h1 class="form-title">Visit 1 — Physical exam</h1>
          <div class="form-actions">
            <div class="remarks-wrap" style="position:relative">
              <button class="btn-secondary" onclick="toggleRemarks(this)" id="remarks-btn" style="gap:var(--space-1)">
                <span id="remarks-label">Remarks: Queries, SDV mode</span>
                <i class="ti ti-chevron-down" style="font-size:11px;color:var(--color-text-tertiary)"></i>
              </button>
              <div class="remarks-menu" id="remarks-menu">
                <div class="remarks-section-label">Activate mode</div>
                <button class="remarks-item active-mode" id="mode-queries" onclick="toggleRemarksMode('queries')">
                  <span>Queries</span>
                  <i class="ti ti-check" style="font-size:13px;color:var(--blue-600)" id="check-queries"></i>
                </button>
                <button class="remarks-item active-mode" id="mode-sdv" onclick="toggleRemarksMode('sdv')">
                  <span>SDV mode</span>
                  <i class="ti ti-check" style="font-size:13px;color:var(--blue-600)" id="check-sdv"></i>
                </button>
              </div>
            </div>
            <button class="btn-secondary" id="btn-submit-review">Submit for review</button>
            <button class="btn-primary" id="btn-run-validations">Run validations</button>
            <button class="btn-icon" title="More actions"><i class="ti ti-dots-vertical"></i></button>
          </div>
        </div>

        <!-- Vital signs -->
        <div>
          <div class="section-title">Vital signs</div>
          <div class="field-grid-4">

            <!-- Field with open query — click flag or link to open thread -->
            <div class="field" id="field-temp">
              <label class="field-label">Rectal temperature <span style="color:var(--red-600)">*</span></label>
              <div class="field-row">
                <input class="field-input" id="input-temp" type="text" value="28.5">
                <button class="sdv-btn" id="sdv-btn-temp" onclick="toggleSdv('temp')" title="SDV: click to verify"><i class="ti ti-shield" id="sdv-icon-temp"></i></button>
                <button class="flag-btn" title="No open query"><i class="ti ti-flag"></i></button>
              </div>
            </div>

            <div class="field" id="field-heart">
              <label class="field-label">Heart rate <span style="color:var(--red-600)">*</span></label>
              <div class="field-row">
                <input class="field-input" id="input-heart" type="text" value="64" oninput="onFieldChange('heart',this.value)">
                <button class="sdv-btn" id="sdv-btn-heart" onclick="toggleSdv('heart')" title="SDV: click to verify"><i class="ti ti-shield" id="sdv-icon-heart"></i></button>
                <button class="flag-btn" id="flag-heart" title="No open query"><i class="ti ti-flag"></i></button>
              </div>
              <span class="field-hint">Normal: 50–80 bpm</span>
            </div>

            <div class="field" id="field-resp">
              <label class="field-label">Respiratory rate <span style="color:var(--red-600)">*</span></label>
              <div class="field-row">
                <input class="field-input" id="input-resp" type="text" value="24" oninput="onFieldChange('resp',this.value)">
                <button class="sdv-btn" id="sdv-btn-resp" onclick="toggleSdv('resp')" title="SDV: click to verify"><i class="ti ti-shield" id="sdv-icon-resp"></i></button>
                <button class="flag-btn" id="flag-resp" title="No open query"><i class="ti ti-flag"></i></button>
              </div>
              <span class="field-hint">Normal: 12–36 bpm</span>
            </div>

            <div class="field" id="field-weight">
              <label class="field-label">Body weight <span style="color:var(--red-600)">*</span></label>
              <div class="field-row">
                <input class="field-input" id="input-weight" type="text" value="400" oninput="onFieldChange('weight',this.value)">
                <button class="sdv-btn" id="sdv-btn-weight" onclick="toggleSdv('weight')" title="SDV: click to verify"><i class="ti ti-shield" id="sdv-icon-weight"></i></button>
                <button class="flag-btn" id="flag-weight" title="No open query"><i class="ti ti-flag"></i></button>
              </div>
              <span class="field-hint">kg</span>
            </div>

          </div>
        </div>

        <!-- Long text field with query example -->
        <div style="margin-top:var(--space-2)">
          <div class="section-title">Clinical remarks</div>
          <div style="max-width:480px">
            <div class="field">
              <label class="field-label">General clinical impression</label>
              <div class="field-row">
                <input class="field-input" type="text" value="Normal appearance, no abnormalities observed" style="font-family:var(--font-sans)">
                <button class="sdv-btn" id="sdv-btn-clin" onclick="toggleSdv('clin')" title="SDV: click to verify"><i class="ti ti-shield" id="sdv-icon-clin"></i></button>

          <i class="ti ti-info-circle" style="color:var(--blue-600);margin-right:4px"></i>

        </p>

<script>



// ── Remarks dropdown ──────────────────────────────────────────────────────
function toggleRemarks(btn) {
  const menu = document.getElementById('remarks-menu');
  const isOpen = menu.classList.contains('open');
  menu.classList.toggle('open', !isOpen);
}

// Checkbox-style: each mode independently toggleable
const activeModes = { queries: true, sdv: true }; // both on by default

function toggleRemarksMode(mode) {
  document.getElementById('remarks-menu').classList.remove('open');
  activeModes[mode] = !activeModes[mode];

  // Update checkmark visibility
  document.getElementById('check-' + mode).style.display = activeModes[mode] ? '' : 'none';
  document.getElementById('mode-' + mode).classList.toggle('active-mode', activeModes[mode]);

  // Update button label
  const active = Object.entries(activeModes).filter(([,v])=>v).map(([k])=> k==='queries'?'Queries':'SDV mode');
  const label = active.length === 0 ? 'Remarks' : 'Remarks: ' + active.join(', ');
  document.getElementById('remarks-label').textContent = label;

  // Show/hide SDV progress bar
  document.getElementById('sdv-progress-row').style.display = activeModes.sdv ? 'flex' : 'none';

  // SDV icons: hide only unverified when SDV off; verified stay visible
  document.querySelectorAll('.sdv-btn').forEach(b => {
    // When SDV on: all btns visible. When SDV off: hide unverified only.
    if (!activeModes.sdv && !b.classList.contains('verified')) b.style.display = 'none';
    else b.style.display = 'flex';
  });
  // On SDV mode activate: ensure all sdv-btn show (including gray unverified)
  if (activeModes.sdv) {
    document.querySelectorAll('.sdv-btn').forEach(b => { b.style.display = 'flex'; });
  }

  // Query icons: hide inactive flag buttons when queries off; flagged ones stay
  document.querySelectorAll('.flag-btn').forEach(b => {
    if (!activeModes.queries && !b.classList.contains('flagged')) b.style.display = 'none';
    else b.style.display = '';
  });
  // Field-state query text: hide only when no active query AND queries off
  document.querySelectorAll('.field-state').forEach(el => {
    const hasActive = el.classList.contains('state-query') || el.classList.contains('state-clean');
    if (!activeModes.queries && !hasActive) el.style.display = 'none';
    else el.style.display = '';
  });

  updateActionButtons();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.remarks-wrap')) {
    const menu = document.getElementById('remarks-menu');
    if (menu) menu.classList.remove('open');
  }
});

function toggleOverflow(btn) {
  const menu = btn.nextElementSibling;
  menu.classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.overflow-wrap')) {
    document.querySelectorAll('.overflow-menu.open').forEach(m => m.classList.remove('open'));
  }
});

// ── SDV field verification ─────────────────────────────────────────────────
const sdvState = {};
const sdvFields = ['temp','heart','resp','weight','clin'];

function toggleSdv(fieldId) {
  sdvState[fieldId] = !sdvState[fieldId];
  const btn  = document.getElementById('sdv-btn-' + fieldId);
  const icon = document.getElementById('sdv-icon-' + fieldId);
  if (!btn || !icon) return;
  if (sdvState[fieldId]) {
    btn.classList.add('verified');
    icon.className = 'ti ti-shield-check-filled';
    btn.title = 'SDV verified — click to undo';
  } else {
    btn.classList.remove('verified');
    icon.className = 'ti ti-shield';
    btn.title = 'SDV: click to verify';
  }
  updateSdvProgress();
}

function updateSdvProgress() {
  const done = sdvFields.filter(id => sdvState[id]).length;
  const total = sdvFields.length;
  const pct = Math.round(done / total * 100);
  const fill = document.getElementById('sdv-prog');
  const label = document.getElementById('sdv-prog-label');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = done + '/' + total + ' verified';
}

function verifyAll() {
  sdvFields.forEach(id => {
    sdvState[id] = true;
    const btn  = document.getElementById('sdv-btn-' + id);
    const icon = document.getElementById('sdv-icon-' + id);
    if (btn)  btn.classList.add('verified');
    if (icon) icon.className = 'ti ti-shield-check-filled';
  });
  updateSdvProgress();
}

// Init: heart rate pre-verified, buttons set to SDV state
sdvState['heart'] = true;

function updateActionButtons() {
  const submitBtn = document.getElementById('btn-submit-review');
  const runBtn    = document.getElementById('btn-run-validations');
  if (!submitBtn || !runBtn) return;
  if (activeModes.sdv) {
    submitBtn.textContent = 'Verify all';
    submitBtn.onclick = verifyAll;
    runBtn.textContent = 'Mark SDV complete';
    runBtn.onclick = () => { verifyAll(); alert('SDV marked complete. Audit trail entry created.'); };
  } else {
    submitBtn.textContent = 'Submit for review';
    submitBtn.onclick = null;
    runBtn.textContent = 'Run validations';
    runBtn.onclick = null;
  }
}

window.addEventListener('load', () => {
  updateSdvProgress();
  // Sync heart rate btn
  const hBtn  = document.getElementById('sdv-btn-heart');
  const hIcon = document.getElementById('sdv-icon-heart');
  if (hBtn)  hBtn.classList.add('verified');
  if (hIcon) hIcon.className = 'ti ti-shield-check-filled';
  updateActionButtons();
});
</script>
