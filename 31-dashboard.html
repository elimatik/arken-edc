<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arken EDC — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --color-nav-bg:#1A1F2E; --color-nav-hover:#2C3248; --color-nav-icon:#8aafc8;
  --color-nav-separator:rgba(255,255,255,0.08);
  --color-page-bg:#FBFBFB; --color-surface:#FFFFFF;
  --color-border:#E8E8E6; --color-border-subtle:#F0F0EE;
  --color-text-primary:#2C2D33; --color-text-secondary:#4F535B;
  --color-text-tertiary:#6D7480; --color-text-placeholder:#C4C4C2;
  --color-link:#3D4A5C; --color-hover-bg:#F0F0EE;
  --color-cta-bg:#1A1F2E; --color-cta-hover:#2C3248; --color-focus-ring:#3D8FE0;
  --amber-50:#FFF8E7; --amber-200:#F5B830; --amber-700:#8A5C00;
  --orange-50:#FFF0E8; --orange-200:#F48E50; --orange-700:#A33A08;
  --red-50:#FFF0F0; --red-200:#EC8585; --red-600:#B52626;
  --green-50:#EEFAF4; --green-200:#58BC88; --green-600:#1A6B47;
  --blue-50:#E8F4FF; --blue-200:#7AB8EE; --blue-600:#1760A8;
  --purple-50:#F0EEFF; --purple-200:#A9A3EC; --purple-600:#534AB7;
  --slate-50:#EEF1F6; --slate-200:#8AA0B8; --slate-600:#3D5A78;
  --font-sans:'Roboto',system-ui,sans-serif; --font-mono:'Roboto Mono',monospace;
  --text-xs:11px; --text-sm:12px; --text-base:14px; --text-lg:16px; --text-xl:18px; --text-3xl:24px;
  --weight-medium:500; --weight-bold:700;
  --radius-sm:2px; --radius-md:4px; --radius-lg:6px; --radius-full:9999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
  --duration-fast:120ms; --ease-default:cubic-bezier(0.16,1,0.3,1);
  --tracking-caps:0.07em;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--text-base);color:var(--color-text-primary);background:var(--color-page-bg);-webkit-font-smoothing:antialiased}

/* ─── Shell ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidenav{width:74px;background:var(--color-nav-bg);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;gap:2px;flex-shrink:0}
.nav-logo{width:30px;height:30px;border-radius:var(--radius-md);background:var(--color-nav-hover);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-3)}
.nav-logo span{font-size:var(--text-base);font-weight:700;color:#fff}
.nav-item{width:100%;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--color-nav-icon);cursor:pointer;transition:background var(--duration-fast);padding:4px 0;position:relative}
.nav-item:hover,.nav-item.active{background:var(--color-nav-hover);color:#fff}
.nav-item i{font-size:20px} .nav-label{font-size:11px;font-weight:500;color:inherit;text-align:center}
.nav-badge{position:absolute;top:6px;right:18px;min-width:14px;height:14px;padding:0 3px;border-radius:var(--radius-full);background:var(--red-600);color:#fff;font-size:9px;font-weight:700;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center}
.nav-spacer{flex:1} .nav-sep{width:100%;height:1px;background:var(--color-nav-separator);margin:var(--space-2) 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* ─── Topbar ── */
.topbar{height:56px;background:var(--color-nav-bg);display:flex;align-items:center;padding:0 var(--space-5);gap:var(--space-3);flex-shrink:0}
.tb-study{background:var(--color-nav-hover);color:#fff;font-size:var(--text-base);font-weight:500;padding:7px var(--space-4);border-radius:var(--radius-md);border:1px solid #525D73;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.tb-study i{font-size:11px;opacity:0.7}
.site-dd-item{display:flex;align-items:center;width:100%;padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-family:var(--font-sans);color:var(--color-text-primary);background:none;border:none;cursor:pointer;text-align:left;transition:background var(--duration-fast)}
.site-dd-item:hover{background:var(--color-hover-bg)}
.site-dd-item.active{color:var(--blue-600);font-weight:500;background:var(--blue-50)}
.tb-site{color:#fff;font-size:var(--text-base);display:flex;align-items:center;gap:3px;cursor:pointer;border:none;background:none;font-family:var(--font-sans);font-weight:500;white-space:nowrap}
.tb-site:hover{color:rgba(255,255,255,0.7)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:none;background:transparent;color:#fff;cursor:pointer}
.tb-icon:hover{background:var(--color-nav-hover)} .tb-icon i{font-size:20px}
.tb-role-btn{background:var(--color-nav-hover);color:#fff;font-size:var(--text-sm);font-weight:500;padding:3px var(--space-2);border-radius:var(--radius-md);border:1px solid #525D73;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:var(--font-sans)}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:#3D5A78;color:#EEF1F6;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}

/* ─── Role demo bar ── */
.demo-bar{height:34px;background:var(--color-border-subtle);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 var(--space-5);gap:var(--space-2);flex-shrink:0}
.demo-label{font-size:var(--text-xs);color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-right:var(--space-1)}
.demo-btn{height:22px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--text-xs);font-family:var(--font-sans);color:var(--color-text-secondary);cursor:pointer;transition:all var(--duration-fast);white-space:nowrap}
.demo-btn:hover{border-color:var(--blue-200);color:var(--blue-600)}
.demo-btn.active{background:var(--color-cta-bg);border-color:var(--color-cta-bg);color:#fff;font-weight:500}

/* ─── Page ── */
.page-wrap{flex:1;overflow-y:auto;padding:var(--space-5) var(--space-5) var(--space-8)}
.page-wrap::-webkit-scrollbar{width:4px}
.page-wrap::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:2px}

/* ─── Greeting ── */
.greeting{margin-bottom:var(--space-5)}
.greeting-name{font-size:var(--text-3xl);font-weight:500}
.greeting-sub{font-size:var(--text-sm);color:var(--color-text-tertiary);margin-top:3px}
.greeting-sub span{color:var(--color-text-secondary);font-weight:500}

/* ─── Stat chips ── */
.stat-row{display:grid;gap:var(--space-3);margin-bottom:var(--space-4)}
.stat-chip{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4)}
.stat-chip-val{font-size:var(--text-xl);font-weight:500;font-family:var(--font-mono);line-height:1.2}
.stat-chip-val.warn{color:var(--amber-700)} .stat-chip-val.alert{color:var(--orange-700)}
.stat-chip-val.crit{color:var(--red-600)} .stat-chip-val.good{color:var(--green-600)}
.stat-chip-lbl{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:2px}
.stat-chip-trend{font-size:var(--text-xs);display:flex;align-items:center;gap:3px;margin-top:3px}
.trend-up{color:var(--green-600)} .trend-dn{color:var(--red-600)} .trend-neu{color:var(--color-text-tertiary)}
.stat-chip.accent-warn{border-left:3px solid var(--amber-700)}
.stat-chip.accent-alert{border-left:3px solid var(--orange-700)}
.stat-chip.accent-crit{border-left:3px solid var(--red-600)}
.stat-chip.accent-good{border-left:3px solid var(--green-600)}
.stat-chip.accent-blue{border-left:3px solid var(--blue-600)}

/* ─── Dashboard grid — aligned columns ── */
.dash-grid{display:grid;gap:var(--space-4);align-items:start}
.dash-2col{grid-template-columns:2fr 1fr}
.dash-3col{grid-template-columns:1fr 1fr 1fr}
.dash-even{grid-template-columns:1fr 1fr}
.dash-col{display:flex;flex-direction:column;gap:var(--space-4)}

/* ─── Card ── */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg)}
.card-header{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:44px}
.card-title{font-size:var(--text-base);font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:var(--space-2)}
.card-title i{font-size:15px;color:var(--color-text-tertiary)}
.card-title-wrap{display:flex;flex-direction:column;gap:1px}
.card-subtitle{font-size:var(--text-xs);color:var(--color-text-tertiary)}
.card-link{font-size:var(--text-xs);color:var(--color-link);background:none;border:none;cursor:pointer;font-family:var(--font-sans);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.card-link:hover{color:var(--color-text-primary)}
.card-body{padding:var(--space-4)}

/* ─── Enrollment bar ── */
.enroll-wrap{padding:var(--space-4)}
.enroll-nums{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-2)}
.enroll-big{font-size:28px;font-weight:500;font-family:var(--font-mono)}
.enroll-tgt{font-size:var(--text-sm);color:var(--color-text-tertiary);font-family:var(--font-mono)}
.enroll-pct{font-size:var(--text-lg);font-weight:500;font-family:var(--font-mono);color:var(--color-text-secondary)}
.enroll-track{width:100%;height:6px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden;margin-bottom:var(--space-3)}
.enroll-fill{height:100%;border-radius:var(--radius-full);background:var(--blue-600);transition:width 0.4s}
.enroll-legend{display:flex;gap:var(--space-4);flex-wrap:wrap}
.enroll-leg{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-xs);color:var(--color-text-secondary)}
.enroll-leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ─── Mini bar ── */
.mini-bar-wrap{display:flex;align-items:center;gap:var(--space-2)}
.mini-bar-track{width:64px;height:4px;background:var(--color-border);border-radius:var(--radius-full);flex-shrink:0}
.mini-bar-fill{height:100%;border-radius:var(--radius-full);background:var(--blue-600)}
.mini-bar-fill.low{background:var(--orange-700)}

/* ─── Table ── */
.dash-table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.dash-table th{padding:var(--space-2) var(--space-3);text-align:left;font-size:var(--text-xs);font-weight:500;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-tertiary);border-bottom:1px solid var(--color-border);white-space:nowrap}
.dash-table th:first-child{padding-left:var(--space-4)}
.dash-table th:last-child{padding-right:var(--space-4)}
.dash-table td{padding:var(--space-2) var(--space-3);vertical-align:middle;border-bottom:1px solid var(--color-border-subtle)}
.dash-table td:first-child{padding-left:var(--space-4)}
.dash-table td:last-child{padding-right:var(--space-4)}
.dash-table tr:last-child td{border-bottom:none}
.dash-table tr:hover td{background:var(--color-hover-bg)}
.mono{font-family:var(--font-mono);font-size:var(--text-sm)}
.muted{color:var(--color-text-secondary)}
.nw{color:var(--amber-700);font-family:var(--font-mono);font-weight:500}
.na{color:var(--orange-700);font-family:var(--font-mono);font-weight:500}
.nc{color:var(--red-600);font-family:var(--font-mono);font-weight:500}
.ng{color:var(--green-600);font-family:var(--font-mono);font-weight:500}

/* ─── Query rows ── */
.query-list{display:flex;flex-direction:column}
.qrow{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle);cursor:pointer;transition:background var(--duration-fast)}
.qrow:last-child{border-bottom:none}
.qrow:hover{background:var(--color-hover-bg)}
.qrow-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.qi-open{background:var(--amber-700)} .qi-auto{background:var(--slate-600)} .qi-mine{background:var(--blue-600)}
.qrow-body{flex:1;min-width:0}
.qrow-subject{font-size:var(--text-sm);font-weight:500;font-family:var(--font-mono)}
.qrow-text{font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow-meta{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:2px}
.qbadge{display:inline-flex;align-items:center;padding:1px var(--space-2);border-radius:var(--radius-full);font-size:10px;font-weight:500;border:1px solid;white-space:nowrap;flex-shrink:0;align-self:flex-start}
.qb-open{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.qb-resp{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-600)}

/* ─── Visit / activity rows ── */
.list-rows{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle);cursor:pointer;transition:background var(--duration-fast)}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--color-hover-bg)}
.list-row.overdue{background:var(--red-50)}
.list-row.overdue:hover{background:#fce9e9}
.date-box{width:38px;height:38px;border-radius:var(--radius-md);background:var(--color-page-bg);border:1px solid var(--color-border);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.date-box-day{font-size:15px;font-weight:700;font-family:var(--font-mono);line-height:1}
.date-box-mon{font-size:9px;text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-tertiary)}
.date-box.is-today{background:var(--blue-600);border-color:var(--blue-600)}
.date-box.is-today .date-box-day,.date-box.is-today .date-box-mon{color:#fff}
.date-box.is-overdue{background:var(--red-50);border-color:var(--red-200)}
.date-box.is-overdue .date-box-day,.date-box.is-overdue .date-box-mon{color:var(--red-600)}
.list-row-body{flex:1;min-width:0}
.list-row-primary{font-size:var(--text-sm);font-weight:500;font-family:var(--font-mono)}
.list-row-secondary{font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:1px}
.vtag{display:inline-flex;align-items:center;padding:1px var(--space-2);border-radius:var(--radius-full);font-size:10px;font-weight:500;border:1px solid;white-space:nowrap;flex-shrink:0}
.vt-due{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-600)}
.vt-today{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.vt-overdue{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}
.vt-ok{background:var(--green-50);border-color:var(--green-200);color:var(--green-600)}

/* ─── Activity feed ── */
.act-row{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle)}
.act-row:last-child{border-bottom:none}
.act-icon{width:24px;height:24px;border-radius:50%;border:1px solid var(--color-border);background:var(--color-page-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.act-icon i{font-size:12px;color:var(--color-text-tertiary)}
.act-body{flex:1;min-width:0}
.act-text{font-size:var(--text-sm);color:var(--color-text-primary);line-height:1.4}
.act-text strong{font-family:var(--font-mono);font-weight:500}
.act-ts{font-size:var(--text-xs);font-family:var(--font-mono);color:var(--color-text-tertiary);margin-top:2px}

/* ─── Safety items ── */
.safety-list{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4)}
.sitem{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-page-bg)}
.sitem.s-crit{background:var(--red-50);border-color:var(--red-200)}
.sitem.s-warn{background:var(--amber-50);border-color:var(--amber-200)}
.sitem.s-good{background:var(--green-50);border-color:var(--green-200)}
.sitem-icon i{font-size:18px;color:var(--color-text-tertiary)}
.sitem.s-crit .sitem-icon i{color:var(--red-600)}
.sitem.s-warn .sitem-icon i{color:var(--amber-700)}
.sitem.s-good .sitem-icon i{color:var(--green-600)}
.sitem-body{flex:1;min-width:0}
.sitem-title{font-size:var(--text-sm);font-weight:500}
.sitem-sub{font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:1px}
.sitem-count{font-size:var(--text-lg);font-weight:500;font-family:var(--font-mono);flex-shrink:0}
.sitem.s-crit .sitem-count{color:var(--red-600)}
.sitem.s-warn .sitem-count{color:var(--amber-700)}
.sitem.s-good .sitem-count{color:var(--green-600)}

/* ─── Arm balance ── */
.arm-list{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3) var(--space-4)}
.arm-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-1)}
.arm-label{font-size:var(--text-sm);font-weight:500}
.arm-count{font-size:var(--text-sm);font-family:var(--font-mono);color:var(--color-text-secondary)}
.arm-track{width:100%;height:7px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden}
.arm-fill-a{height:100%;border-radius:var(--radius-full);background:var(--blue-600)}
.arm-fill-b{height:100%;border-radius:var(--radius-full);background:var(--purple-600)}

/* ─── SDV rows ── */
.sdv-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--color-border-subtle)}
.sdv-row:last-child{border-bottom:none}
.sdv-name{font-size:var(--text-sm);flex:1}
.sdv-track{width:100px;height:4px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden;flex-shrink:0}
.sdv-fill{height:100%;border-radius:var(--radius-full);background:var(--blue-600)}
.sdv-fill.low{background:var(--orange-700)}
.sdv-pct{font-size:var(--text-xs);font-family:var(--font-mono);color:var(--color-text-secondary);width:36px;text-align:right;flex-shrink:0}
.sdv-pct.low{color:var(--orange-700)}

/* ─── Query categories ── */
.qcat-list{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4)}
.qcat-row{display:flex;align-items:center;gap:var(--space-3)}
.qcat-label{font-size:var(--text-sm);flex:1;color:var(--color-text-primary)}
.qcat-track{width:80px;height:6px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden;flex-shrink:0}
.qcat-fill{height:100%;border-radius:var(--radius-full)}
.qcat-count{font-size:var(--text-sm);font-family:var(--font-mono);font-weight:500;width:20px;text-align:right;flex-shrink:0}

/* ─── Lock rows ── */
.lock-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--color-border-subtle)}
.lock-row:last-child{border-bottom:none}
.lock-id{font-family:var(--font-mono);font-size:var(--text-sm);font-weight:500;min-width:100px}
.lock-site{font-size:var(--text-xs);color:var(--color-text-tertiary);flex:1}
.lock-forms{font-size:var(--text-xs);font-family:var(--font-mono);color:var(--color-text-secondary);white-space:nowrap}
.btn-xs{height:26px;padding:0 var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--text-xs);font-weight:500;font-family:var(--font-sans);color:var(--color-text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;transition:background var(--duration-fast)}
.btn-xs:hover{background:var(--color-hover-bg)}
.btn-xs i{font-size:12px}

/* ─── Milestone rows ── */
.milestone-list{display:flex;flex-direction:column}
.ms-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle)}
.ms-row:last-child{border-bottom:none}
.ms-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ms-dot.done{background:var(--green-600)}
.ms-dot.active{background:var(--blue-600)}
.ms-dot.future{background:var(--color-border);border:2px solid var(--color-text-placeholder)}
.ms-body{flex:1;min-width:0}
.ms-label{font-size:var(--text-sm);font-weight:500}
.ms-sub{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:1px}
.ms-date{font-size:var(--text-xs);font-family:var(--font-mono);color:var(--color-text-tertiary);white-space:nowrap}

/* ─── Invoice summary rows ── */
.inv-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle)}
.inv-row:last-child{border-bottom:none}
.inv-site{font-size:var(--text-sm);font-weight:500;flex:1}
.inv-amount{font-size:var(--text-sm);font-family:var(--font-mono);font-weight:500;color:var(--color-text-primary);text-align:right;min-width:80px}
.inv-badge{display:inline-flex;align-items:center;padding:1px var(--space-2);border-radius:var(--radius-full);font-size:10px;font-weight:500;border:1px solid;white-space:nowrap;margin-left:auto}
.ib-paid{background:var(--green-50);border-color:var(--green-200);color:var(--green-600)}
.ib-due{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.ib-overdue{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}

/* ─── User/role rows (Admin) ── */
.user-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle)}
.user-row:last-child{border-bottom:none}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--slate-50);border:1px solid var(--slate-200);color:var(--slate-600);font-size:var(--text-xs);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-body{flex:1;min-width:0}
.user-name{font-size:var(--text-sm);font-weight:500}
.user-role{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:1px}
.role-chip{display:inline-flex;align-items:center;padding:1px var(--space-2);border-radius:var(--radius-full);font-size:10px;font-weight:500;border:1px solid;white-space:nowrap}
.rc-crc{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-600)}
.rc-cra{background:var(--purple-50);border-color:var(--purple-200);color:var(--purple-600)}
.rc-pi{background:var(--green-50);border-color:var(--green-200);color:var(--green-600)}
.rc-dm{background:var(--slate-50);border-color:var(--slate-200);color:var(--slate-600)}
.rc-pm{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.rc-admin{background:var(--red-50);border-color:var(--red-200);color:var(--red-600)}

/* ─── Completeness grid ── */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);padding:var(--space-3) var(--space-4)}
.comp-item{display:flex;flex-direction:column;gap:3px}
.comp-lbl{font-size:var(--text-xs);color:var(--color-text-tertiary)}
.comp-val{font-size:var(--text-lg);font-weight:500;font-family:var(--font-mono)}
.comp-track{width:100%;height:4px;background:var(--color-border);border-radius:var(--radius-full);overflow:hidden}
.comp-fill{height:100%;border-radius:var(--radius-full);background:var(--green-600)}
.comp-fill.partial{background:var(--amber-700)}
.comp-fill.low{background:var(--red-600)}

/* ─── Config status rows (Admin) ── */
.cfg-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border-subtle)}
.cfg-row:last-child{border-bottom:none}
.cfg-label{font-size:var(--text-sm);flex:1}
.cfg-sub{font-size:var(--text-xs);color:var(--color-text-tertiary);margin-top:1px}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:10px;font-weight:500;border:1px solid;white-space:nowrap}
.sp-ok{background:var(--green-50);border-color:var(--green-200);color:var(--green-600)}
.sp-warn{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700)}
.sp-pending{background:var(--slate-50);border-color:var(--slate-200);color:var(--slate-600)}

/* Buttons */
.btn-secondary{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;font-family:var(--font-sans);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-primary);cursor:pointer;transition:background var(--duration-fast)}
.btn-secondary:hover{background:var(--color-hover-bg)} .btn-secondary i{font-size:14px}
.btn-primary{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;font-family:var(--font-sans);border:none;border-radius:var(--radius-md);background:var(--color-cta-bg);color:#fff;cursor:pointer;transition:background var(--duration-fast)}
.btn-primary:hover{background:var(--color-cta-hover)} .btn-primary i{font-size:14px}
</style>
</head>
<body>

  <div class="main">

<script>
/* ══ HELPERS ══════════════════════════════════════════════════════════════ */
function chip(val, lbl, accent, trend) {
  var ac = accent ? ' accent-' + accent : '';
  var vc = {'warn':' warn','alert':' alert','crit':' crit','good':' good','blue':''}[accent] || '';
  var tr = trend ? '<div class="stat-chip-trend trend-' + trend.d + '"><i class="ti ti-trending-' + (trend.d==='up'?'up':'down') + '" style="font-size:11px"></i>' + trend.t + '</div>' : '';
  return '<div class="stat-chip' + ac + '"><div class="stat-chip-val' + vc + '">' + val + '</div><div class="stat-chip-lbl">' + lbl + '</div>' + tr + '</div>';
}
function mbar(pct) {
  return '<div class="mini-bar-wrap"><div class="mini-bar-track"><div class="mini-bar-fill' + (pct<60?' low':'') + '" style="width:' + pct + '%"></div></div><span class="mono" style="font-size:var(--text-xs);color:var(--color-text-secondary)">' + pct + '%</span></div>';
}
function enrollBar(cur, tgt, pct, legs) {
  var legHtml = legs.map(function(l){ return '<div class="enroll-leg"><div class="enroll-leg-dot" style="background:' + l.c + '"></div>' + l.t + '</div>'; }).join('');
  return '<div class="enroll-wrap"><div class="enroll-nums"><span class="enroll-big">' + cur + '</span><span class="enroll-tgt">/ ' + tgt + ' target</span><span class="enroll-pct">' + pct + '%</span></div><div class="enroll-track"><div class="enroll-fill" style="width:' + pct + '%"></div></div><div class="enroll-legend">' + legHtml + '</div></div>';
}
function qrow(subj, text, meta, status, iconCls, badgeCls) {
  return '<div class="qrow"><div class="qrow-icon ' + iconCls + '">' + (iconCls==='qi-open'?'!':iconCls==='qi-mine'?'?':'A') + '</div><div class="qrow-body"><div class="qrow-subject">' + subj + '</div><div class="qrow-text">' + text + '</div><div class="qrow-meta">' + meta + '</div></div><span class="qbadge ' + badgeCls + '">' + status + '</span></div>';
}
function vrow(day, mon, primary, secondary, tagCls, tagTxt, isOverdue) {
  var rc = isOverdue ? ' overdue' : '';
  var dc = isOverdue ? ' is-overdue' : (tagCls==='vt-today' ? ' is-today' : '');
  return '<div class="list-row' + rc + '"><div class="date-box' + dc + '"><div class="date-box-day">' + day + '</div><div class="date-box-mon">' + mon + '</div></div><div class="list-row-body"><div class="list-row-primary">' + primary + '</div><div class="list-row-secondary">' + secondary + '</div></div><span class="vtag ' + tagCls + '">' + tagTxt + '</span></div>';
}
function arow(icon, text, ts) {
  return '<div class="act-row"><div class="act-icon"><i class="ti ' + icon + '"></i></div><div class="act-body"><div class="act-text">' + text + '</div><div class="act-ts">' + ts + '</div></div></div>';
}
function srow(name, enrolled, target, queries, overdue, lastVisit) {
  var pct = Math.round(enrolled/target*100);
  return '<tr><td>' + name + '</td><td class="mono">' + enrolled + '</td><td class="mono muted">' + target + '</td><td>' + mbar(pct) + '</td><td class="' + (queries>3?'nw':'mono muted') + '">' + (queries||'—') + '</td><td class="' + (overdue>0?'na':'mono muted') + '">' + (overdue||'—') + '</td><td class="mono muted" style="font-size:var(--text-xs)">' + lastVisit + '</td></tr>';
}
function sdvRow(name, pct) {
  return '<div class="sdv-row"><span class="sdv-name">' + name + '</span><div class="sdv-track"><div class="sdv-fill' + (pct<60?' low':'') + '" style="width:' + pct + '%"></div></div><span class="sdv-pct' + (pct<60?' low':'') + '">' + pct + '%</span></div>';
}
function qcatRow(lbl, n, pct, fillCls) {
  return '<div class="qcat-row"><span class="qcat-label">' + lbl + '</span><div class="qcat-track"><div class="qcat-fill ' + fillCls + '" style="width:' + pct + '%;background:' + ({ec:'var(--amber-700)',md:'var(--orange-700)',or:'var(--red-600)',sd:'var(--purple-600)',ot:'var(--slate-600)'}[fillCls]||'var(--blue-600)') + '"></div></div><span class="qcat-count">' + n + '</span></div>';
}
function lockRow(id, site, forms) {
  return '<div class="lock-row"><span class="lock-id">' + id + '</span><span class="lock-site">' + site + '</span><span class="lock-forms">' + forms + '</span><button class="btn-xs"><i class="ti ti-lock"></i> Lock</button></div>';
}
function msRow(label, sub, date, state) {
  var dc = {done:'done', active:'active', future:'future'}[state] || 'future';
  return '<div class="ms-row"><div class="ms-dot ' + dc + '"></div><div class="ms-body"><div class="ms-label">' + label + '</div><div class="ms-sub">' + sub + '</div></div><span class="ms-date">' + date + '</span></div>';
}
function invRow(site, amount, status) {
  var bc = {paid:'ib-paid', due:'ib-due', overdue:'ib-overdue'}[status] || 'ib-due';
  var bl = status.charAt(0).toUpperCase() + status.slice(1);
  return '<div class="inv-row"><span class="inv-site">' + site + '</span><span class="inv-amount">' + amount + '</span><span class="inv-badge ' + bc + '">' + bl + '</span></div>';
}
function userRow(initials, name, role, roleCls, site, lastLogin) {
  return '<div class="user-row"><div class="user-avatar">' + initials + '</div><div class="user-body"><div class="user-name">' + name + '</div><div class="user-role">' + site + ' · Last login: ' + lastLogin + '</div></div><span class="role-chip ' + roleCls + '">' + role + '</span></div>';
}
function cfgRow(label, sub, status) {
  var sc = {ok:'sp-ok', warn:'sp-warn', pending:'sp-pending'}[status] || 'sp-pending';
  var sl = {ok:'Complete', warn:'Review needed', pending:'Pending'}[status] || status;
  var icon = {ok:'ti-circle-check', warn:'ti-alert-triangle', pending:'ti-clock'}[status] || 'ti-clock';
  return '<div class="cfg-row"><div class="cfg-body" style="flex:1"><div class="cfg-label">' + label + '</div><div class="cfg-sub">' + sub + '</div></div><span class="status-pill ' + sc + '"><i class="ti ' + icon + '" style="font-size:11px"></i>' + sl + '</span></div>';
}
function card(title, icon, action, body) {
  var hdr = '<div class="card-header"><div class="card-title"><i class="ti ' + icon + '"></i>' + title + '</div>' + (action ? '<button class="card-link">' + action + '</button>' : '') + '</div>';
  return '<div class="card">' + hdr + body + '</div>';
}

/* ══ CRC ══════════════════════════════════════════════════════════════════ */
function renderCRC() {
  var h = '<div class="greeting"><div class="greeting-name">Good morning, Elisa</div><div class="greeting-sub">Mon 09 Jun 2026 · <span>Austin Research Center</span> · AK-2401</div></div>';

  h += chip('30','Subjects enrolled','blue',{d:'up',t:'+2 this week'});

  h += chip('3','Queries assigned to me','warn','');
  h += chip('2','Forms overdue','alert','');
  h += chip('4','Visits this week','','');

  h += '<div class="dash-col">';

    qrow('AUSB1P2-01','Body weight — Visit 1 (missing unit)','Q-002 · J. Hollis (CRA) · May 06','Awaiting my response','qi-open','qb-open') +
    qrow('AUSB1P3-01','AE form — date inconsistency','Q-003 · Edit check · May 04','Responded','qi-auto','qb-resp') +
  '</div>');
  h += card('Overdue forms','ti-forms','Open Data Entry →','<div class="list-rows">' +
    vrow('06','Jun','AUSB1P3-01 · Bovine #A-006','Visit 2 — Physical exam','vt-overdue','Overdue 3 days',true) +
    vrow('07','Jun','AUSB1P3-02 · Bovine #A-007','Visit 2 — Treatment admin.','vt-overdue','Overdue 2 days',true) +
  '</div>');
  h += card('Recent activity','ti-activity','','<div>' +
    arow('ti-forms','<strong>AUSB1P1-01</strong> — Visit 2 Physical exam saved','Today 08:42 UTC') +
    arow('ti-message-report','Query Q-003 response submitted for <strong>AUSB1P3-01</strong>','Yesterday 16:14 UTC') +
    arow('ti-check','<strong>AUSB1P1-04</strong> — End of study form completed','Jun 07 · 11:30 UTC') +
  '</div>');
  h += '</div>';
  /* Right */
  h += '<div class="dash-col">';
  h += card('Site enrollment','ti-users','',enrollBar(30,40,75,[{c:'var(--blue-600)',t:'Group A — 16 subjects'},{c:'var(--purple-600)',t:'Group B — 14 subjects'},{c:'var(--color-border)',t:'10 slots remaining'}]));
  h += card('Upcoming visits','ti-calendar-event','View all →','<div class="list-rows">' +
    vrow('09','Jun','AUSB1P1-02 · Bovine #A-002','Visit 3 — Day 14','vt-today','Today',false) +
    vrow('10','Jun','AUSB1P2-01 · Bovine #A-005','Visit 3 — Day 14','vt-due','Tomorrow',false) +
    vrow('11','Jun','AUSB1P1-03 · Bovine #A-003','Visit 3 — Day 14','vt-due','In 2 days',false) +
    vrow('14','Jun','AUSB2P4-01 · Bovine #B-001','Visit 4 — Day 28','vt-due','In 5 days',false) +
  '</div>');
  h += '</div>';
  h += '</div>';
  return h;
}

/* ══ CRA ══════════════════════════════════════════════════════════════════ */
function renderCRA() {
  var h = '<div class="greeting"><div class="greeting-name">Good morning, James</div><div class="greeting-sub">Mon 09 Jun 2026 · <span>All sites</span> · AK-2401</div></div>';
  h += '<div class="stat-row" style="grid-template-columns:repeat(5,1fr)">';
  h += chip('89','Subjects enrolled (all sites)','blue',{d:'up',t:'+5 this week'});
  h += chip('11','Total open queries','warn','');
  h += chip('3','Overdue queries (> 7 days)','alert','');
  h += chip('62%','Avg SDV progress','','');
  h += chip('3','Monitoring visits scheduled','','');
  h += '</div>';
  h += '<div class="dash-grid dash-2col">';
  /* Left */
  h += '<div class="dash-col">';
  h += card('Site comparison','ti-building-hospital','Export →','<table class="dash-table"><thead><tr><th>Site</th><th>Enrolled</th><th>Target</th><th>Progress</th><th>Queries</th><th>Overdue</th><th>Last entry</th></tr></thead><tbody>' +
    srow('Austin',30,40,4,2,'May 09') + srow('Dallas',29,40,5,1,'May 08') + srow('Houston',30,40,2,0,'May 09') +
  '</tbody></table>');
  h += card('Open queries by site','ti-message-report','View all →','<div class="query-list">' +
    qrow('AUSB1P1-01','Rectal temp — Visit 2 out of range','Q-001 · Austin · Edit check · May 07','Awaiting CRC response','qi-open','qb-open') +
    qrow('DALB1P7-02','Body weight missing unit — Visit 1','Q-004 · Dallas · J. Hollis · May 06','Awaiting CRC response','qi-open','qb-open') +
    qrow('HOUB1P1-02','Clinical remarks — inconsistency','Q-005 · Houston · Edit check · May 05','Responded','qi-auto','qb-resp') +
  '</div>');
  h += '</div>';
  /* Right */
  h += '<div class="dash-col">';
  h += card('SDV progress','ti-shield-check','','<div>' + sdvRow('Austin Research Center',74) + sdvRow('Dallas Vet Clinic',58) + sdvRow('Houston Animal Hospital',42) + '</div>');
  h += card('Next monitoring visits','ti-calendar','','<div class="list-rows">' +
    vrow('15','Jun','Austin Research Center','Routine monitoring · SDV planned','vt-due','In 6 days',false) +
    vrow('22','Jun','Dallas Vet Clinic','Routine monitoring','vt-due','In 13 days',false) +
    vrow('01','Jul','Houston Animal Hospital','Follow-up visit','vt-due','In 22 days',false) +
  '</div>');
  h += card('Recent activity','ti-activity','','<div>' +
    arow('ti-shield-check','SDV completed — <strong>AUSB1P1-01</strong> Visit 1 · Heart rate field','Today 09:00 UTC') +
    arow('ti-message-report','Query Q-004 raised on <strong>DALB1P7-02</strong>','Yesterday 14:22 UTC') +
    arow('ti-check','Monitoring visit report submitted — Dallas','Jun 05 · 16:40 UTC') +
  '</div>');
  h += '</div>';
  h += '</div>';
  return h;
}

/* ══ PI ═══════════════════════════════════════════════════════════════════ */
function renderPI() {
  var h = '<div class="greeting"><div class="greeting-name">Good morning, Dr. Mercer</div><div class="greeting-sub">Mon 09 Jun 2026 · <span>AK-2401 — BRD Cattle Phase II</span> · Principal Investigator</div></div>';
  h += '<div class="stat-row" style="grid-template-columns:repeat(5,1fr)">';
  h += chip('89','Subjects enrolled','blue',{d:'up',t:'+5 this week'});
  h += chip('74%','Enrollment progress','good','');
  h += chip('0','Active SAEs','good','');
  h += chip('2','Subjects on hold','warn','');
  h += chip('11','Open queries (all sites)','warn','');
  h += '</div>';
  h += '<div class="dash-grid dash-2col">';

var LABELS = {CRC:'CRC', CRA:'CRA / Monitor', PI:'Principal Investigator', DM:'Data Manager', PM:'Project Manager', Admin:'Administrator'};

function setRole(role) {
  document.querySelectorAll('.demo-btn').forEach(function(b,i){ b.classList.toggle('active', ROLES[i]===role); });
  document.getElementById('tb-role-display').innerHTML = LABELS[role] + ' <i class="ti ti-chevron-right" style="font-size:10px"></i>';
  document.getElementById('page-wrap').innerHTML = RENDERERS[role]();
}

/* ══ SITE DROPDOWN ════════════════════════════════════════════════════════ */
var SLABELS = {'':'All sites', AUS:'Austin Research Center', DAL:'Dallas Vet Clinic', HOU:'Houston Animal Hospital'};
function toggleSiteDD() {
  var dd=document.getElementById('site-dd'), chev=document.getElementById('tb-site-chev');
  var open=dd.style.display!=='none';
  dd.style.display=open?'none':'block';
  chev.className=open?'ti ti-chevron-down':'ti ti-chevron-up';
  chev.style.fontSize='11px'; chev.style.opacity='0.7';
}
document.addEventListener('click',function(e){
  var w=document.getElementById('site-dd-wrap');
  if(w&&!w.contains(e.target)){
    var dd=document.getElementById('site-dd'),chev=document.getElementById('tb-site-chev');
    if(dd)dd.style.display='none';
    if(chev){chev.className='ti ti-chevron-down';chev.style.fontSize='11px';chev.style.opacity='0.7';}
  }
});
function setSite(site) {
  var btn=document.getElementById('tb-site-btn');
  btn.innerHTML=(SLABELS[site]||'All sites')+' <i class="ti ti-chevron-down" id="tb-site-chev" style="font-size:11px;opacity:0.7"></i>';
  document.querySelectorAll('.site-dd-item').forEach(function(b){
    var m=b.getAttribute('onclick')&&b.getAttribute('onclick').match(/setSite\(['"]([^'"]*)['"]\)/);
    b.classList.toggle('active',m?m[1]===site:false);
  });
  document.getElementById('site-dd').style.display='none';
}
